<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Availability">
<title>Availability</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#17202a;background:#f5f7f9}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #d7dde3;padding:16px;z-index:3}h1{margin:0;font-size:26px}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7dde3;border-radius:14px;margin-bottom:14px;overflow:hidden}.card h2{font-size:17px;margin:0;padding:13px 14px;background:#e8eef5}.gap{display:grid;grid-template-columns:1fr 52px 70px;gap:9px;align-items:center;padding:9px 12px;border-top:1px solid #edf0f2}.gap:first-of-type{border-top:0}.name{font-weight:700}.count{font-size:24px;font-weight:800;text-align:center}.plus,.minus,.reset{border:0;border-radius:10px;font-weight:800}.plus{height:46px;font-size:25px;background:#e7f4e8}.minus{height:46px;font-size:22px;background:#f3f3f3}.gapcontrols{display:grid;grid-template-columns:52px 70px;gap:7px}.total{display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:19px;font-weight:800;border-top:2px solid #cfd6dd}.total span:last-child{font-size:27px}.investigate{padding:10px}.item{border:1px solid #dfe4e8;border-radius:10px;padding:9px;margin-bottom:9px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row.three{grid-template-columns:repeat(3,1fr)}label{font-size:11px;font-weight:700;color:#56616c}input,textarea{width:100%;font:inherit;padding:9px;border:1px solid #cfd6dd;border-radius:8px;background:#fff}textarea{min-height:55px;resize:vertical}.difference{font-weight:800;padding:10px 2px}.notes{padding:12px}.notes textarea{min-height:110px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.reset{padding:14px;background:#fff;border:1px solid #d7dde3;font-size:16px}.add{padding:14px;border:0;border-radius:10px;background:#e8eef5;font-weight:800;font-size:16px}.hint{text-align:center;color:#6a747d;font-size:12px;margin:8px 0 20px}
</style></head>
<body><header><h1>Availability</h1></header><main>
<section class="card"><h2>Gaps</h2><div id="gaps"></div><div class="total"><span>STORE TOTAL</span><span id="storeTotal">0</span></div></section>
<section class="card"><h2>Items to investigate</h2><div class="investigate" id="items"></div><div style="padding:0 10px 12px"><button class="add" id="addItem" style="width:100%">+ Add item</button></div></section>
<section class="card"><h2>Additional information</h2><div class="notes"><textarea id="notes" placeholder="Add notes here…"></textarea></div></section>
<div class="actions"><button class="reset" id="resetGaps">Reset gaps</button><button class="reset" id="resetAll">Reset everything</button></div>
<p class="hint">Saved automatically on this iPhone.</p>
</main>
<script>
const AREAS=['AMBIENT','FV','CHILLER','BREAD','BAKERY','FREEZER','MEAT','CONV','MILK'];
const KEY='availability-app-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{gaps:Object.fromEntries(AREAS.map(x=>[x,0])),items:[],notes:''};
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function renderGaps(){let box=document.getElementById('gaps');box.innerHTML='';AREAS.forEach(a=>{let d=document.createElement('div');d.className='gap';d.innerHTML=`<div class="name">${a}</div><div class="count">${state.gaps[a]||0}</div><div class="gapcontrols"><button class="minus">−</button><button class="plus">+</button></div>`;d.querySelector('.plus').onclick=()=>{state.gaps[a]=(state.gaps[a]||0)+1;save();renderGaps()};d.querySelector('.minus').onclick=()=>{state.gaps[a]=Math.max(0,(state.gaps[a]||0)-1);save();renderGaps()};box.appendChild(d)});document.getElementById('storeTotal').textContent=AREAS.reduce((s,a)=>s+(state.gaps[a]||0),0)}
function blankItem(){return{code:'',stock:'',floor:'',warehouse:'',findings:''}}
function renderItems(){let box=document.getElementById('items');box.innerHTML='';state.items.forEach((it,i)=>{let d=document.createElement('div');d.className='item';let diff=(it.stock!==''&&it.floor!==''&&it.warehouse!=='')?((+it.floor||0)+(+it.warehouse||0)-(+it.stock||0)):'';d.innerHTML=`<div class="row"><div><label>Item code</label><input data-k="code" value="${esc(it.code)}"></div><div><label>Stock file</label><input inputmode="numeric" data-k="stock" value="${esc(it.stock)}"></div></div><div class="row three" style="margin-top:8px"><div><label>Shop floor</label><input inputmode="numeric" data-k="floor" value="${esc(it.floor)}"></div><div><label>Warehouse</label><input inputmode="numeric" data-k="warehouse" value="${esc(it.warehouse)}"></div><div><label>Difference +/-</label><div class="difference">${diff===''?'—':(diff>0?'+':'')+diff}</div></div></div><div style="margin-top:8px"><label>Findings / action</label><textarea data-k="findings">${esc(it.findings)}</textarea></div>`;d.querySelectorAll('input,textarea').forEach(el=>el.oninput=e=>{it[e.target.dataset.k]=e.target.value;save();if(['stock','floor','warehouse'].includes(e.target.dataset.k)) renderItems()});box.appendChild(d)})}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
document.getElementById('addItem').onclick=()=>{state.items.push(blankItem());save();renderItems()};document.getElementById('notes').value=state.notes;document.getElementById('notes').oninput=e=>{state.notes=e.target.value;save()};document.getElementById('resetGaps').onclick=()=>{if(confirm('Reset all gap counts to zero?')){AREAS.forEach(a=>state.gaps[a]=0);save();renderGaps()}};document.getElementById('resetAll').onclick=()=>{if(confirm('Clear all gaps, items and notes?')){state={gaps:Object.fromEntries(AREAS.map(x=>[x,0])),items:[],notes:''};save();document.getElementById('notes').value='';renderGaps();renderItems()}};
if(!state.items.length) for(let i=0;i<3;i++) state.items.push(blankItem());save();renderGaps();renderItems();
</script></body></html>
