<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Availability • UI Test 2.0</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142135;background:#f3f5f9}
  *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
  .loading{max-width:390px;background:white;border:1px solid #e8edf4;box-shadow:0 10px 40px #13294416;border-radius:22px;padding:25px;text-align:center}
  .glyph{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:#2164df;color:white;font-weight:900;font-size:25px;margin:auto auto 12px}
  h1{margin:0 0 9px;font-size:22px;letter-spacing:-.4px}p{line-height:1.6;font-size:14px;color:#62738a}
  small{color:#9f5c07;background:#fff5df;padding:5px 10px;border-radius:20px;font-weight:850}
</style>
</head>
<body>
<div class="loading" role="status" id="loader">
<div class="glyph">A</div><h1>Availability Test 2.0</h1>
<p>Opening redesigned store availability app…</p><small>DESIGN TEST · LIVE APP UNCHANGED</small>
</div>
<script>
/* The production app remains the source of truth. This file imports it only
   when viewed on GitHub Pages, then modifies the *test page* in memory. */
const SHARP_CSS = String.raw`
:root{--ui-blue:#2164df;--ui-blue-dark:#174db0;--ui-ink:#142135;--ui-muted:#69798d;--ui-line:#e7ebf2;--ui-green:#19875a;--ui-canvas:#f3f5f9;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--ui-canvas);color:var(--ui-ink)}
html,body{background:var(--ui-canvas);color:var(--ui-ink);overscroll-behavior-y:contain}
body{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
button,input{font-family:inherit}button:focus-visible,input:focus-visible{outline:3px solid #7aafff;outline-offset:2px}button{-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s,border-color .15s,transform .1s}
header{background:rgba(255,255,255,.94);padding:calc(11px + env(safe-area-inset-top)) 16px 11px;border-bottom:1px solid var(--ui-line);box-shadow:0 2px 10px rgba(22,35,60,.025)}
.topbar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:11px}
.brandmark{flex:0 0 40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#3482fe,#1653bc);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(32,100,223,.22)}
.brandmark svg{width:23px;height:23px;fill:none;stroke:white;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
.appidentity{min-width:0;flex:1}h1{font-size:19px;letter-spacing:-.65px;font-weight:850;line-height:1.07}.appsubtitle{font-size:11px;letter-spacing:.05px;color:#8390a2;margin-top:4px;font-weight:600}
.testpill{border-radius:8px;padding:6px 8px;color:#94570f;background:#fff3dc;border:1px solid #f4deb1;letter-spacing:1px;font-size:10px;font-weight:950;white-space:nowrap}
main{padding:12px 12px 3px;max-width:784px}
.overview{position:relative;overflow:hidden;border-radius:20px;padding:17px 18px 16px;margin:0 0 13px;color:#fff;background:linear-gradient(115deg,#172840 0%,#203a5c 60%,#234b84 100%);box-shadow:0 8px 18px rgba(22,43,77,.12)}
.overview:before{content:"";pointer-events:none;position:absolute;right:-69px;top:-75px;width:220px;height:220px;border:1px solid rgba(255,255,255,.08);border-radius:50%}
.overview:after{content:"";pointer-events:none;position:absolute;right:-35px;top:-45px;width:150px;height:150px;border:1px solid rgba(255,255,255,.09);border-radius:50%}
.overviewtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}.eyebrow{font-size:10px;font-weight:850;letter-spacing:1.65px;color:#bfd5f4}.overviewdate{font-size:11px;color:#d1e1f5;font-weight:650;white-space:nowrap}
.overviewmain{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px;position:relative;z-index:1}.overviewlabel{display:block;color:#dce8f8;font-weight:650;font-size:12px}.overviewvalue{font-size:55px;font-weight:900;line-height:1.03;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-top:3px}.overviewmicro{color:#aebfda;font-size:11px;font-weight:500;margin-top:6px}
.overviewcounter{text-align:right;padding-bottom:4px}.countfigure{font-size:25px;line-height:1.05;margin-top:9px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.7px}.countfigure span:last-child{font-size:13px;color:#a9c0dd;font-weight:650;letter-spacing:0}
.progress-track{height:5px;margin-top:16px;border-radius:10px;background:rgba(255,255,255,.17);overflow:hidden;position:relative;z-index:1}.progress-fill{height:100%;width:0%;border-radius:10px;background:#65d8ac;transition:width .2s}
.card{background:#fff;border:1px solid #edf0f5;border-radius:19px;overflow:hidden;margin-bottom:12px;box-shadow:0 5px 22px rgba(23,41,70,.035)}
.card h2{background:#fff;color:var(--ui-ink);font-size:16px;letter-spacing:-.28px;font-weight:900;padding:18px 16px 9px}.card h2 .headnote{display:block;margin-top:4px;color:#8491a0;font-size:11px;font-weight:500;letter-spacing:0}
.setup{background:#fff;border-bottom:0;padding:0 4px 11px}.fieldrow{display:grid;grid-template-columns:67px minmax(0,1fr);gap:8px;min-height:56px;padding:7px 12px;border-top:0}.fieldrow label,.fieldlabel{font-size:13px;font-weight:800;color:#41516a}
.storeinput{background:#f7f9fc;border:1.5px solid #e0e6ee;height:44px;min-width:0;width:130px;color:var(--ui-ink);border-radius:11px;font-size:18px;letter-spacing:.3px;padding-left:13px}.storeinput:focus{background:#fff;border-color:var(--ui-blue);box-shadow:0 0 0 3px rgba(33,100,223,.11)}
.scorecontrol{max-width:310px;gap:6px}.scorebtn{height:44px;border:1.5px solid #e0e6ee;border-radius:11px;background:#f7f9fc;color:#53647b;font-size:17px;font-weight:800}.scorebtn.selected{background:var(--ui-blue);border-color:var(--ui-blue);box-shadow:0 3px 9px rgba(33,100,223,.16)}
.reasonpanel{padding:11px 13px 11px 88px;background:#fff;border-top:0}.reasonhead strong{font-weight:800;color:#40526c;font-size:12px}.scorereasoninput{background:#f7f9fc;border-color:#e0e6ee}.reasonfooter{color:#8c99aa}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 13px;background:#f9fafc;border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}.sectiontitle strong{font-size:13px;letter-spacing:.06px;font-weight:900}.sectiontitle span{font-size:11px;color:#9aa5b2;font-weight:700;white-space:nowrap}
.gaprow{display:grid;grid-template-columns:minmax(78px,1fr) 42px 55px 42px 75px;align-items:center;gap:5px;padding:11px 12px;border-top:1px solid #edf0f4;border-left:3px solid transparent;background:#fff;transition:background-color .13s ease}
#gaps .gaprow:first-child{border-top:0}.gaprow.done{background:#fbfdfc;border-left-color:#28a473}.gaprow.bulkdone{background:#fbfdfc;border-left-color:#a8cabb}.gaprow.additionalrow{border-top:1px solid #e2e8f0;background:#fafbfe}.gaprow.additionalrow.done{background:#fbfdfc}
.area{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:850;line-height:1.18;letter-spacing:-.18px;color:#26384f;overflow-wrap:anywhere}.area:before{content:"";display:block;flex:none;width:6px;height:6px;border-radius:50%;background:#d7dee9}.gaprow.done .area:before{background:#26a26d}.gaprow.bulkdone .area:before{background:#a7c6b8}
.counter{width:42px;height:46px;border:1px solid transparent;border-radius:11px;font-size:27px;box-shadow:none;font-weight:500;line-height:1}.minus{background:#f0f3f8;border-color:#e9edf3;color:#516884}.plus{background:#eaf1ff;border-color:#dbe7ff;color:#175cd4}
.editwrap{width:55px;height:46px}.gapinput,.additionalinput{height:46px;border:1.5px solid #d7e3f6;border-radius:11px;font-size:19px;font-weight:850;color:#153967;background:#fff;box-shadow:0 0 0 2px rgba(33,100,223,.015)}.gapinput:focus,.additionalinput:focus{box-shadow:0 0 0 3px rgba(33,100,223,.13)}.editcue{font-size:9px;letter-spacing:.55px;color:#7b9dc9;font-weight:900}
.donebtn{height:44px;width:75px;border-radius:11px;border:1px solid #dce3ec;background:#f7f9fc;color:#718198;font-weight:800;font-size:11px;line-height:1;padding:0 4px}.gaprow.done .counter{opacity:.36}.gaprow.done .gapinput,.gaprow.done .additionalinput{background:#f5fbf8;border:1.5px solid #cce8da;color:#187149}.gaprow.done .donebtn{background:#e1f5eb;border-color:#c1e8d4;color:#16764c}.gaprow.bulkdone .donebtn{background:#eef5f1;border-color:#dceae2;color:#5b8171}.gaprow.bulkdone .gapinput,.gaprow.bulkdone .additionalinput{background:#fbfdfc;border-color:#d8e8dc;color:#24724f}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #e8edf3;background:#f9fafc;padding:14px 15px}.totalbadge{grid-column:auto;width:auto;border:0;padding:0;justify-self:auto;text-align:left}.totaltitle{font-size:10px;letter-spacing:1.25px;color:#8491a2;font-weight:900}#storeTotal{font-size:29px;font-weight:900;line-height:1.06;letter-spacing:-1px;margin-top:4px}
.completeall{grid-column:auto;width:auto;min-width:116px;height:42px;border-radius:11px;padding:0 13px;font-size:12px;font-weight:850;background:#eaf1ff;color:#1857bd;border:1px solid #dae7fb}.completeall:disabled{background:var(--ui-green)}
.actions{padding:14px 15px 7px}.publish,.formlink{border-radius:13px;min-height:54px;font-size:15px;font-weight:850}.publish{background:linear-gradient(180deg,#2876f0,#1b61db);color:#fff;box-shadow:0 5px 12px rgba(33,100,223,.14)}.publish:disabled{background:#eef1f6;color:#8391a5;box-shadow:none;border:1px solid #e3e7ef;font-size:13px}.formlink{min-height:45px;background:#fff;color:#455f80;border:1px solid #dfe6ef;margin-top:8px;font-size:12px;letter-spacing:.6px}
.toolbar{gap:8px;padding:7px 15px 14px;grid-template-columns:1.25fr 1fr}.toolbar button{min-height:42px;border-radius:11px;font-size:12px;font-weight:800}.undo,.redo{background:#f1f4f8;color:#61758f;border:1px solid #e9edf2}.reset{background:#fff5f4;color:#bc5b51;border:1px solid #fae2df}.status{padding:3px 10px 13px;color:#96a2b0;font-size:11px}
.customkeypad{background:rgba(21,31,49,.98);border-color:rgba(255,255,255,.09);padding:12px 12px calc(11px + env(safe-area-inset-bottom))}.keypadtop{max-width:520px;margin-bottom:10px}.keypadlabel{font-size:13px;color:#dfe8f6}.keypadhide{background:#39475d;border-radius:9px}.keypadgrid{gap:7px}.keypadkey{height:53px;background:#344159;border:1px solid rgba(255,255,255,.07);border-radius:12px;color:#f5f7fc;font-size:22px}.keypadkey.backspace{background:#2b3850}.keypadkey.enter{background:#286be2;font-size:14px}.resetmodal{background:rgba(12,21,36,.43);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.resetbox{border-radius:20px 20px 12px 12px}.scoreguideclose,.scoreguidesideclose,.syspopupclose{background:#2164df}
@media(min-width:600px){main{padding:19px 20px}.overview{padding:23px 27px 22px}.overviewvalue{font-size:66px}.gaprow{grid-template-columns:minmax(150px,1fr) 49px 75px 49px 104px;padding:11px 18px;gap:12px}.counter{width:49px;height:49px}.editwrap{width:75px;height:49px}.gapinput,.additionalinput{height:49px}.donebtn{width:104px;height:49px;font-size:13px}.area{font-size:15px}}
@media(max-width:380px){main{padding:10px 8px 0}.gaprow{grid-template-columns:minmax(69px,1fr) 38px 50px 38px 66px;padding:10px 7px;gap:4px}.counter{width:38px;height:44px;font-size:26px}.editwrap{width:50px;height:44px}.gapinput,.additionalinput{height:44px}.donebtn{width:66px;height:44px;font-size:10px}.area{font-size:12px;gap:5px}.sectiontitle{padding:13px}.overview{padding:16px 15px}.countfigure{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
`;
const HEADER = `<header><div class="topbar">
  <div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.1 4L19 6.5"/><path d="M5 5v3M5 16v3M19 16v3"/></svg></div>
  <div class="appidentity"><h1>Availability</h1><div class="appsubtitle">Daily store check</div></div>
  <span class="testpill">TEST 2.0</span>
</div></header>`;
const HERO = `<main>
<section class="overview" aria-label="Daily summary">
  <div class="overviewtop"><span class="eyebrow">TODAY'S OVERVIEW</span><span class="overviewdate" id="todayDate"></span></div>
  <div class="overviewmain">
    <div><span class="overviewlabel">Availability gaps</span><div class="overviewvalue" id="heroTotal">0</div><div class="overviewmicro">Total recorded so far</div></div>
    <div class="overviewcounter"><span class="overviewlabel">Sections counted</span><div class="countfigure"><span id="doneCount">0</span><span> / 9</span></div><div class="overviewmicro" id="progressText">Ready to begin</div></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</section>`;
const DASHBOARD_JS = String.raw`
(function(){
  const date=document.getElementById('todayDate');
  if(date)date.textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const gaps=document.getElementById('gaps');
  const total=document.getElementById('storeTotal');
  function refresh(){
    const rows=Array.from(gaps.querySelectorAll('.gaprow:not(.additionalrow)'));
    const complete=rows.filter(r=>r.classList.contains('done')).length;
    document.getElementById('doneCount').textContent=String(complete);
    document.getElementById('heroTotal').textContent=total.textContent||'0';
    document.getElementById('progressFill').style.width=(complete/9*100)+'%';
    document.getElementById('progressText').textContent=complete===9?'All sections counted':complete===0?'Ready to begin':(9-complete)+' remaining';
  }
  new MutationObserver(refresh).observe(gaps,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  new MutationObserver(refresh).observe(total,{childList:true,subtree:true,characterData:true});
  refresh();
})();
`;
function replaceRequired(source,oldStr,newStr,name){
  if(!source.includes(oldStr))throw new Error('The live source has changed: '+name);
  return source.replace(oldStr,newStr);
}
async function start(){
  const loader=document.getElementById('loader');
  try{
    const src=location.protocol==='file:'
       ?'https://7q6jncc29f-lab.github.io/Availability-app/index.html'
       :new URL('./index.html',location.href).href;
    const response=await fetch(src,{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load production app ('+response.status+')');
    let source=await response.text();
    source=replaceRequired(source,'</style>',SHARP_CSS+'\n</style>','styles');
    source=replaceRequired(source,'<header><h1>Availability</h1></header>',HEADER,'header');
    source=replaceRequired(source,'<main>\n<section class="card">',HERO+'\n<section class="card">','main');
    source=replaceRequired(source,'<h2>Gaps</h2>','<h2>Store details<span class="headnote">Enter the store and select its score</span></h2>','store details');
    source=replaceRequired(source,'  <div id="gaps"></div>','  <div class="sectiontitle"><strong>Department gaps</strong><span>9 sections + additional</span></div>\n  <div id="gaps"></div>','department heading');
    source=replaceRequired(source,"const KEY='availability-app-v2';","const KEY='availability-app-ui-test-v2';",'test storage');
    source=source.replace("const APP_VERSION='1.6';","const APP_VERSION='2.0-ui-test';");
    source=source.replace(/✓ Done/g,'Done');
    source=replaceRequired(source,'logStoreOpenOncePerSession();','logStoreOpenOncePerSession();\n'+DASHBOARD_JS,'dashboard');
    // document.write replaces only this temporary test loader, not any file on GitHub.
    document.open();document.write(source);document.close();
  }catch(error){
    console.error('Availability UI test failed to load:',error);
    loader.innerHTML='<div class="glyph">!</div><h1>Upload this file to GitHub first</h1><p>The test imports the real Availability app from the same repository, so it works when placed beside <code>index.html</code> on GitHub Pages. Your live site is unaffected.</p><p style="font-size:12px">'+String(error.message).replace(/[<>]/g,'')+'</p>';
  }
}
start();
</script>
</body>
</html>
