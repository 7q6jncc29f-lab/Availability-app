<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Availability TEST v67 — Loader</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6f8;color:#17202b}
body{margin:0;padding:24px 15px}
.panel{max-width:540px;margin:13vh auto 0;padding:24px;border-radius:16px;background:#fff;border:1px solid #d8dee5;box-shadow:0 3px 10px #0001}
h1{font-size:23px;margin:0 0 12px}p{font-size:15px;line-height:1.5}strong{color:#c62828}.muted{color:#526276}.error{display:none;background:#fff0f0;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="panel" id="loadingPanel">
<h1>Availability <strong>TEST v67</strong></h1>
<p id="progress">Loading the latest Availability app and applying the reliability fixes…</p>
<p class="muted">This test has separate saved figures. Your live app will not be changed.</p>
<div class="error" id="error"></div>
</div>
<script>
(async function(){
 'use strict';
 const progress=document.getElementById('progress');
 function one(html,from,to,label){
  const first=html.indexOf(from);
  if(first<0 || html.indexOf(from,first+from.length)>=0)throw Error('Could not apply '+label+' (source changed).');
  return html.slice(0,first)+to+html.slice(first+from.length);
 }
 function all(html,from,to,expected,label){
  const found=html.split(from).length-1;
  if(found!==expected)throw Error('Could not apply '+label+': expected '+expected+' occurrences; found '+found+'.');
  return html.split(from).join(to);
 }
 function section(html,opening,closing,code,label){
  const start=html.indexOf(opening),end=html.indexOf(closing,start+opening.length);
  if(start<0||end<0)throw Error('Could not locate '+label+' in the current source.');
  return html.slice(0,start)+code+html.slice(end);
 }
 function patch(source){
  let html=source;
  html=one(html,"const KEY='availability-app-v2';","const KEY='availability-app-v2-test-v67';",'test-only storage');
  html=one(html,"const APP_VERSION='1.6';","const APP_VERSION='1.7-test-v67';",'test version');
  html=one(html,'<title>Availability</title>','<title>Availability TEST v67</title>','test title');
  html=one(html,'<meta name="apple-mobile-web-app-title" content="Availability">','<meta name="apple-mobile-web-app-title" content="Availability TEST">','test icon title');
  html=one(html,'</style>\n</head>','.testmarker{display:inline-block;margin-left:10px;background:#c62828;color:white;font-size:12px;letter-spacing:.4px;font-weight:900;border-radius:6px;padding:5px 8px;vertical-align:middle}\n</style>\n</head>','test banner CSS');
  html=one(html,'<header><h1>Availability</h1></header>','<header><h1>Availability <span class="testmarker">TEST v67</span></h1></header>','test banner');
  const bootstrap=String.raw`
function normalCount(value){
  const raw=String(value??'').trim();
  if(!/^\d+$/.test(raw))return 0;
  const number=Number(raw);
  return Number.isFinite(number)?Math.min(9999,number):0;
}
function cleanDone(value){
  const obj=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
  return Object.fromEntries(AREAS.map(a=>[a,obj[a]===true]));
}
function cleanBulk(value){
  if(!value||typeof value!=='object'||Array.isArray(value)||!value.done||typeof value.done!=='object'||Array.isArray(value.done))return null;
  return {done:cleanDone(value.done),additionalDone:value.additionalDone===true};
}
function cleanSnapshot(value){
  const source=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
  const gaps=source.gaps&&typeof source.gaps==='object'&&!Array.isArray(source.gaps)?source.gaps:{};
  return {
    gaps:Object.fromEntries(AREAS.map(a=>[a,normalCount(gaps[a])])),
    done:cleanDone(source.done),
    additional:normalCount(source.additional),
    additionalDone:source.additionalDone===true,
    bulkCompleteOriginalDone:cleanBulk(source.bulkCompleteOriginalDone)
  };
}
let loaded;
try{
  const raw=localStorage.getItem(KEY);
  loaded=raw?JSON.parse(raw):null;
}catch(e){}
if(!loaded||typeof loaded!=='object'||Array.isArray(loaded))loaded={};
const cleaned=cleanSnapshot(loaded);
let state={
  ...cleaned,
  store:String(loaded.store??'').replace(/\D/g,'').slice(0,4),
  score:['1','2','3','4'].includes(String(loaded.score??''))?String(loaded.score):'',
  scoreReason:typeof loaded.scoreReason==='string'?loaded.scoreReason.slice(0,120):'',
  history:Array.isArray(loaded.history)
    ?loaded.history.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.gaps&&typeof x.gaps==='object').slice(-50).map(cleanSnapshot)
    :[],
  saved:typeof loaded.saved==='string'?loaded.saved:null
};
if(state.scoreReason==='More than 35 availability gaps')state.scoreReason='';
if(!AREAS.every(a=>state.done[a]===true)||!state.additionalDone)state.bulkCompleteOriginalDone=null;
let redoHistory=[];`;
  html=one(html,html.slice(html.indexOf('let state;\n'),html.indexOf('let redoHistory=[];')+'let redoHistory=[];'.length),bootstrap,'saved data recovery');
  html=one(html,'function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}',"function save(){stamp();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){document.getElementById('status').textContent='Warning: changes could not be saved on this device.'}}",'safe saving');
  html=one(html,'function snapshot(){return {gaps:{...state.gaps},done:{...state.done},additional:Number(state.additional)||0,additionalDone:!!state.additionalDone}}','function snapshot(){return {gaps:{...state.gaps},done:{...state.done},additional:normalCount(state.additional),additionalDone:!!state.additionalDone,bulkCompleteOriginalDone:cleanBulk(state.bulkCompleteOriginalDone)}}','bulk state in history');
  html=one(html,'function remember(){\n  redoHistory=[];\n  state.history.push({gaps:{...state.gaps},done:{...state.done},additional:Number(state.additional)||0,additionalDone:!!state.additionalDone});\n  if(state.history.length>50)state.history.shift();\n}', 'function remember(){\n  redoHistory=[];\n  state.history.push(snapshot());\n  if(state.history.length>50)state.history.shift();\n  updateUndoRedo();\n}','consistent history');
  html=one(html,'    remember();state.done[area]=false;','    remember();state.done[area]=false;state.bulkCompleteOriginalDone=null;','locked section undo');
  html=one(html,'    state.done[area]=!state.done[area];','    state.done[area]=!state.done[area];\n    state.bulkCompleteOriginalDone=null;','manual completion after bulk');
  html=all(html,'state.gaps[area]++;','state.gaps[area]=Math.min(9999,normalCount(state.gaps[area])+1);',2,'counter bounds');
  html=all(html,'state.additional=(Number(state.additional)||0)+1','state.additional=Math.min(9999,normalCount(state.additional)+1)',2,'additional bounds');
  html=one(html,'extraDone.onclick=()=>{closeCustomKeypad(false);remember();state.additionalDone=!state.additionalDone;save();renderGaps()};', 'extraDone.onclick=()=>{closeCustomKeypad(false);remember();state.additionalDone=!state.additionalDone;state.bulkCompleteOriginalDone=null;save();renderGaps()};','additional undo tracking');
  const undoCode=`function restoreCountSnapshot(data){
  const clean=cleanSnapshot(data);
  state.gaps=clean.gaps;
  state.done=clean.done;
  state.additional=clean.additional;
  state.additionalDone=clean.additionalDone;
  state.bulkCompleteOriginalDone=clean.bulkCompleteOriginalDone;
}
document.getElementById('undo').onclick=()=>{
  closeCustomKeypad(false);
  const previous=state.history.pop();
  if(!previous)return;
  redoHistory.push(snapshot());
  if(redoHistory.length>50)redoHistory.shift();
  restoreCountSnapshot(previous);
  save();renderGaps();updateUndoRedo();
};
document.getElementById('redo').onclick=()=>{
  closeCustomKeypad(false);
  const next=redoHistory.pop();
  if(!next)return;
  state.history.push(snapshot());
  if(state.history.length>50)state.history.shift();
  restoreCountSnapshot(next);
  save();renderGaps();updateUndoRedo();
};

`;
  html=section(html,"document.getElementById('undo').onclick=()=>{",'function bulkCompleteAll(){',undoCode,'undo/redo state');
  const bulkCode=`function bulkCompleteAll(){
  closeCustomKeypad(false);
  const everythingDone=AREAS.every(a=>state.done[a]===true)&&state.additionalDone===true;
  if(state.bulkCompleteOriginalDone&&everythingDone){
    remember();
    const before=state.bulkCompleteOriginalDone;
    AREAS.forEach(a=>{state.done[a]=!!before.done[a]});
    state.additionalDone=!!before.additionalDone;
    state.bulkCompleteOriginalDone=null;
  }else{
    if(everythingDone)return;
    remember();
    state.bulkCompleteOriginalDone={done:{...state.done},additionalDone:!!state.additionalDone};
    AREAS.forEach(a=>{state.done[a]=true});
    state.additionalDone=true;
  }
  save();renderGaps();
}
function clearAllCompletionTicks(){
  closeCustomKeypad(false);
  remember();
  AREAS.forEach(a=>{state.done[a]=false});
  state.additionalDone=false;
  state.bulkCompleteOriginalDone=null;
  save();renderGaps();
}

`;
  html=section(html,'function bulkCompleteAll(){','let completeAllTapCount=0;',bulkCode,'reliable Complete all');
  html=one(html,"document.getElementById('completeAll').addEventListener('pointerup',()=>{","document.getElementById('completeAll').addEventListener('click',()=>{",'touch and keyboard Complete all');
  const oldReset="  state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:clearStore?'':keepStore,score:'',scoreReason:'',history:[],saved:null,done:{},additional:0,additionalDone:false,bulkCompleteOriginalDone:null};\n  localStorage.setItem(KEY,JSON.stringify(state));\n  location.reload();";
  const newReset="  state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:clearStore?'':keepStore,score:'',scoreReason:'',history:[],saved:null,done:{},additional:0,additionalDone:false,bulkCompleteOriginalDone:null};\n  redoHistory=[];\n  try{localStorage.setItem(KEY,JSON.stringify(state));location.reload();}\n  catch(e){\n    document.getElementById('store').value=state.store;\n    document.getElementById('resetModal').classList.remove('show');\n    syncScoreUI();syncReasonUI();renderGaps();updateUndoRedo();\n    document.getElementById('status').textContent='Warning: changes could not be saved on this device.';\n  }";
  html=one(html,oldReset,newReset,'reset storage resilience');
  const shareCode=[
    "  AREAS.forEach(a=>lines.push(`${LABELS[a]}${publishPad(LABELS[a])}- ${normalCount(state.gaps[a])} ✅`,''));",
    "  if(normalCount(state.additional)>0)",
    "    lines.push(`Additional Counts - ${normalCount(state.additional)}${state.additionalDone?' ✅':''}`, '');",
    "  const text=lines.join('\\n').trimEnd();",
    '',
  ].join('\n');
  html=section(html,'  AREAS.forEach(a=>lines.push(', '  try{',shareCode,'WhatsApp share formatting');
  return html;
 }
 try{
  const response=await fetch('./index.html?testSource='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('Failed to load live app source (HTTP '+response.status+').');
  const source=await response.text();
  if(!source.includes('const AREAS=')||!source.includes('function publishAvailability'))throw Error('Downloaded HTML is not the expected Availability app.');
  const updated=patch(source);
  document.open();document.write(updated);document.close();
 }catch(err){
  progress.textContent='The test page could not load.';
  const el=document.getElementById('error');
  el.style.display='block';
  el.textContent=String(err&&err.message||err);
  console.error('Availability TEST v67:',err);
 }
})();
</script>
</body>
</html>
