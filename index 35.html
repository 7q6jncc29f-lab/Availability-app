<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Availability">
<meta name="theme-color" content="#f3f6f8">
<title>Availability</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#17202b;
  background:#f3f6f8;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f6f8;touch-action:manipulation}
body{padding-bottom:max(8px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer}
button:active:not(:disabled){transform:scale(.985)}

header{
  background:rgba(255,255,255,.96);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid #d8dee5;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
}
h1{margin:0;font-size:24px;line-height:1.1;letter-spacing:-.35px}
main{padding:8px;max-width:760px;margin:auto}
.card{background:#fff;border:1px solid #d4dbe2;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 2px rgba(17,32,49,.04)}
.card h2{font-size:16px;line-height:1.2;margin:0;padding:10px 12px;background:#e9eff5}

.setup{border-bottom:1px solid #e3e7eb;background:#fff}
.fieldrow{display:grid;grid-template-columns:68px minmax(0,1fr);align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #eef1f4}
.fieldrow:first-child{border-top:0}
.fieldrow label,.fieldlabel{font-weight:800;font-size:14px}
.storeinput{
  width:112px;
  height:42px;
  padding:0 11px;
  border:1.5px solid #cbd4dd;
  border-radius:10px;
  font-size:18px;
  font-weight:700;
  background:#fff;
  color:#17202b;
  outline:none;
}
.storeinput:focus{border-color:#1976d2;box-shadow:0 0 0 3px rgba(25,118,210,.12)}
.storeinput.storeerror{background:#fff0f0;border-color:#c62828;color:#9f1d1d;box-shadow:0 0 0 3px rgba(198,40,40,.08)}
.scorecontrol{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:268px}
.scorebtn{
  min-width:0;
  height:42px;
  border:1.5px solid #cbd4dd;
  border-radius:10px;
  background:#fff;
  color:#34404c;
  font-size:17px;
  font-weight:900;
}
.scorebtn.selected{background:#1976d2;border-color:#1976d2;color:#fff;box-shadow:0 2px 6px rgba(25,118,210,.2)}
.scorecontrol.scoreerror{border-radius:12px;box-shadow:0 0 0 3px rgba(198,40,40,.12)}

.gaprow{
  display:grid;
  grid-template-columns:minmax(78px,1fr) 44px 56px 44px 66px;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-top:1px solid #e4e8ec;
  background:#fff1f1;
  transition:background .12s ease;
}
.area{font-weight:850;font-size:15px;line-height:1.08;min-width:0;letter-spacing:-.1px}
.counter{
  width:44px;
  height:46px;
  border:0;
  border-radius:11px;
  font-size:29px;
  line-height:1;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}
.minus{background:#edf3f8;color:#2378d6}
.plus{background:#e5f5e8;color:#16823a}
.editwrap{position:relative;width:56px;height:46px}
.gapinput,.additionalinput{
  width:100%;
  height:46px;
  padding:0 2px;
  border:2px solid #1976d2;
  border-radius:10px;
  text-align:center;
  font-weight:850;
  font-size:18px;
  background:#fff;
  color:#17202b;
  outline:none;
  font-variant-numeric:tabular-nums;
}
.gapinput:focus,.additionalinput:focus{box-shadow:0 0 0 3px rgba(25,118,210,.15)}
.editcue{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.2px;
  color:#1976d2;
  pointer-events:none;
  text-transform:uppercase;
}
.editwrap.hasvalue .editcue{display:none}
.donebtn{
  min-width:0;
  width:66px;
  height:46px;
  border:1px solid #d89797;
  border-radius:11px;
  background:#fff;
  color:#a9221a;
  font-size:9.5px;
  line-height:1.05;
  font-weight:900;
  padding:0 3px;
}
.gaprow.done{background:#edf8ef}
.gaprow.done .counter{opacity:.28}
.gaprow.done .gapinput,.gaprow.done .additionalinput{border-color:#9fc8a7;background:#f9fffa;color:#167b38}
.gaprow.done .donebtn{background:#17823b;color:#fff;border-color:#17823b}
.additionalrow{background:#f8fafb;border-top:2px solid #d9e0e6}
.additionalrow.done{background:#edf8ef}

.total{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;font-size:18px;font-weight:900;border-top:2px solid #cfd6dc;background:#fff;font-variant-numeric:tabular-nums}
.actions{padding:9px 10px 10px;background:#fff}
.publish,.formlink{width:100%;min-height:50px;border:0;border-radius:11px;font-size:15px;font-weight:900;letter-spacing:.05px}
.publish{background:#1976d2;color:#fff}
.publish:disabled{background:#b7c0c8;color:#f4f6f8;opacity:1;cursor:default}
.formlink{display:block;background:#17823b;color:#fff;margin-top:8px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 10px 10px;background:#fff}
.toolbar button{min-height:44px;border:0;border-radius:10px;font-size:14px;font-weight:850}
.undo,.redo{background:#edf1f5;color:#1976d2}
.redo{display:none}
.undoredowrap{display:grid;grid-template-columns:1fr;gap:7px}
.undoredowrap.hasredo{grid-template-columns:1fr 1fr}
.undoredowrap.hasredo .redo{display:block}
.reset{background:#ffe8e8;color:#a71919}
.status{font-size:12px;text-align:center;color:#68727d;padding:2px 10px 10px}

.resetmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;align-items:flex-end;justify-content:center;padding:12px}
.resetmodal.show{display:flex}
.resetbox{width:min(480px,100%);background:#fff;border-radius:18px 18px 14px 14px;padding:16px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.16)}
.resetbox h3{margin:0 0 12px;font-size:20px}
.resetchoice{display:block;width:100%;min-height:54px;margin:8px 0;border:0;border-radius:11px;font-size:16px;font-weight:850;text-align:left;padding:0 14px}
.resetfigures{background:#edf1f5;color:#17202b}.resetall{background:#ffe9e9;color:#a71919}
.resetcancel{display:block;width:100%;min-height:46px;margin-top:5px;border:0;background:transparent;color:#1976d2;font-size:16px;font-weight:850}

@media(max-width:390px){
  main{padding:6px}
  .gaprow{grid-template-columns:minmax(70px,1fr) 42px 53px 42px 62px;gap:4px;padding:6px 7px}
  .counter{width:42px;height:44px;font-size:27px}
  .editwrap,.gapinput,.additionalinput{height:44px}.editwrap{width:53px}
  .area{font-size:14px}
  .donebtn{width:62px;height:44px;font-size:9px}
  .scorecontrol{max-width:none}
}
@media(max-width:350px){
  .gaprow{grid-template-columns:minmax(64px,1fr) 40px 49px 40px 58px;gap:3px;padding-left:5px;padding-right:5px}
  .counter{width:40px}
  .editwrap{width:49px}
  .donebtn{width:58px;font-size:8.4px}
}
</style>
</head>
<body>
<header><h1>Availability</h1></header>
<main>
<section class="card">
  <h2>Gaps</h2>
  <div class="setup">
    <div class="fieldrow" id="storeRow">
      <label for="store">Store</label>
      <input class="storeinput" id="store" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="done" aria-label="Store number">
    </div>
    <div class="fieldrow" id="scoreRow">
      <div class="fieldlabel">Score</div>
      <div class="scorecontrol" id="scoreControl" role="group" aria-label="Score from 1 to 4">
        <button type="button" class="scorebtn" data-score="1" aria-pressed="false">1</button>
        <button type="button" class="scorebtn" data-score="2" aria-pressed="false">2</button>
        <button type="button" class="scorebtn" data-score="3" aria-pressed="false">3</button>
        <button type="button" class="scorebtn" data-score="4" aria-pressed="false">4</button>
      </div>
    </div>
  </div>

  <div id="gaps"></div>
  <div class="total"><span>STORE TOTAL</span><span id="storeTotal">0</span></div>

  <div class="actions">
    <button class="publish" id="publish">Publish Availability</button>
    <button class="formlink" id="formlink">OPEN SYS FORM</button>
  </div>
  <div class="toolbar">
    <div class="undoredowrap" id="undoRedoWrap">
      <button class="undo" id="undo">Undo</button>
      <button class="redo" id="redo">Redo</button>
    </div>
    <button class="reset" id="reset">Reset day</button>
  </div>
</section>
<div class="status" id="status">Saved automatically on this iPhone.</div>
</main>

<div class="resetmodal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
  <div class="resetbox">
    <h3 id="resetTitle">Reset options</h3>
    <button class="resetchoice resetfigures" id="resetFigures">Reset figures</button>
    <button class="resetchoice resetall" id="resetAll">Reset figures &amp; store number</button>
    <button class="resetcancel" id="resetCancel">Cancel</button>
  </div>
</div>

<script>
const AREAS=['AMBIENT','FV','CHILLER','BREAD','FREEZER','BAKERY','MEAT','CONV','MILK'];
const LABELS={AMBIENT:'Ambient',FV:'Fv',CHILLER:'Chiller',BREAD:'Bread',FREEZER:'Freezer',BAKERY:'Bakery',MEAT:'Meat',CONV:'Conv',MILK:'Milk'};
const KEY='availability-app-v2';
const SYS_FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLScGUhe9fbjfRyEJb2WUhafWhEyVVs20PUDapUrmQK1-INcvKg/viewform?pli=1';

let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state) state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:'',score:'',history:[],saved:null,done:{}};
AREAS.forEach(a=>{if(state.gaps[a]==null)state.gaps[a]=0});
if(!state.history)state.history=[];
if(!state.done)state.done={};
if(state.additional==null)state.additional=0;
if(state.additionalDone==null)state.additionalDone=false;
if(!['1','2','3','4'].includes(String(state.score||'')))state.score='';
let redoHistory=[];

function stamp(){
  const d=new Date();
  state.saved=d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  document.getElementById('status').textContent='Saved '+state.saved;
}
function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}
function snapshot(){return {gaps:{...state.gaps},done:{...state.done},additional:Number(state.additional)||0,additionalDone:!!state.additionalDone}}
function updateUndoRedo(){
  const wrap=document.getElementById('undoRedoWrap');
  if(wrap)wrap.classList.toggle('hasredo',redoHistory.length>0);
}
function remember(){
  redoHistory=[];
  state.history.push({gaps:{...state.gaps},done:{...state.done},additional:Number(state.additional)||0,additionalDone:!!state.additionalDone});
  if(state.history.length>50)state.history.shift();
}
function total(){return AREAS.reduce((s,a)=>s+(Number(state.gaps[a])||0),0)}

function syncScoreUI(){
  document.querySelectorAll('.scorebtn').forEach(btn=>{
    const selected=btn.dataset.score===String(state.score||'');
    btn.classList.toggle('selected',selected);
    btn.setAttribute('aria-pressed',selected?'true':'false');
  });
}

function updatePublish(){
  const allCounted=AREAS.every(a=>state.done[a]===true);
  const store=state.store||'';
  const score=state.score||'';
  const validStore=/^\d{3,4}$/.test(store);
  const validScore=['1','2','3','4'].includes(score);
  const btn=document.getElementById('publish');

  btn.disabled=!allCounted;
  if(!allCounted){btn.textContent='Count all sections to publish';return;}
  if(!store && !score){btn.textContent='Enter store number & score';return;}
  if(!store){btn.textContent='Enter store number';return;}
  if(!validStore){btn.textContent='Store number must be 3–4 digits';return;}
  if(!score){btn.textContent='Select score';return;}
  if(!validScore){btn.textContent='Score must be 1–4';return;}
  btn.textContent='Publish Availability';
}

function ensureVisible(el,focus=false){
  if(!el)return;
  if(focus&&typeof el.focus==='function')el.focus({preventScroll:true});
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),80);
}

const lockedTapCounts={};
function lockedCounterTap(area){
  if(!state.done[area])return false;
  lockedTapCounts[area]=(lockedTapCounts[area]||0)+1;
  if(lockedTapCounts[area]>=2){
    lockedTapCounts[area]=0;
    remember();state.done[area]=false;
    save();renderGaps();
  }
  return true;
}

function makeGapRow(area){
  const row=document.createElement('div');
  row.className='gaprow'+(state.done[area]?' done':'');
  row.dataset.area=area;
  row.innerHTML=`
    <div class="area">${LABELS[area]}</div>
    <button type="button" class="counter minus" aria-label="Decrease ${LABELS[area]}">−</button>
    <div class="editwrap ${state.done[area] || state.gaps[area]?'hasvalue':''}">
      <input class="gapinput" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder=" " aria-label="${LABELS[area]} gap count" value="${state.done[area] ? Number(state.gaps[area]||0) : (state.gaps[area]||'')}" ${state.done[area]?'disabled':''}>
      ${state.done[area]?'':'<span class="editcue">EDIT</span>'}
    </div>
    <button type="button" class="counter plus" aria-label="Increase ${LABELS[area]}">+</button>
    <button type="button" class="donebtn">${state.done[area]?'✓ Counted':'Not counted'}</button>`;

  const gapInput=row.querySelector('.gapinput');
  gapInput.onfocus=()=>{
    if(state.done[area])return;
    gapInput.dataset.before=String(state.gaps[area]||0);
    gapInput.dataset.remembered='';
    setTimeout(()=>{
      try{if(gapInput.value)gapInput.setSelectionRange(0,gapInput.value.length)}catch(e){}
      ensureVisible(gapInput,false);
    },120);
  };
  gapInput.oninput=()=>{
    if(state.done[area])return;
    const v=gapInput.value.replace(/\D/g,'');
    gapInput.value=v;
    if(!gapInput.dataset.remembered&&Number(v||0)!==Number(gapInput.dataset.before||0)){
      remember();gapInput.dataset.remembered='1';
    }
    state.gaps[area]=v===''?0:Number(v);
    gapInput.parentElement.classList.toggle('hasvalue',v!=='');
    save();
    document.getElementById('storeTotal').textContent=total();
  };
  gapInput.onblur=()=>{gapInput.value=state.done[area] ? Number(state.gaps[area]||0) : (state.gaps[area]||'')};

  row.querySelector('.plus').onclick=()=>{if(lockedCounterTap(area))return;remember();state.gaps[area]++;save();renderGaps()};
  row.querySelector('.minus').onclick=()=>{if(lockedCounterTap(area))return;if(state.gaps[area]>0){remember();state.gaps[area]--;}save();renderGaps()};
  row.querySelector('.donebtn').onclick=()=>{lockedTapCounts[area]=0;remember();state.done[area]=!state.done[area];save();renderGaps()};
  return row;
}

function renderGaps(){
  const box=document.getElementById('gaps');
  box.innerHTML='';
  AREAS.forEach(a=>box.appendChild(makeGapRow(a)));

  const extra=document.createElement('div');
  extra.className='gaprow additionalrow'+(state.additionalDone?' done':'');
  extra.innerHTML=`
    <div class="area">Additional<br>Counts</div>
    <button type="button" class="counter minus" aria-label="Decrease additional counts">−</button>
    <div class="editwrap ${state.additionalDone || state.additional?'hasvalue':''}">
      <input class="additionalinput" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder=" " aria-label="Additional counts" value="${state.additionalDone ? Number(state.additional||0) : (state.additional||'')}" ${state.additionalDone?'disabled':''}>
      ${state.additionalDone?'':'<span class="editcue">EDIT</span>'}
    </div>
    <button type="button" class="counter plus" aria-label="Increase additional counts">+</button>
    <button type="button" class="donebtn">${state.additionalDone?'✓ Done':'Not done'}</button>`;

  const extraInput=extra.querySelector('.additionalinput');
  extraInput.onfocus=()=>{
    if(state.additionalDone)return;
    extraInput.dataset.before=String(state.additional||0);
    extraInput.dataset.remembered='';
    setTimeout(()=>{
      try{if(extraInput.value)extraInput.setSelectionRange(0,extraInput.value.length)}catch(e){}
      ensureVisible(extraInput,false);
    },120);
  };
  extraInput.oninput=()=>{
    if(state.additionalDone)return;
    const v=extraInput.value.replace(/\D/g,'');
    extraInput.value=v;
    if(!extraInput.dataset.remembered&&Number(v||0)!==Number(extraInput.dataset.before||0)){
      remember();extraInput.dataset.remembered='1';
    }
    state.additional=v===''?0:Number(v);
    extraInput.parentElement.classList.toggle('hasvalue',v!=='');
    save();
  };
  extraInput.onblur=()=>{extraInput.value=state.additionalDone ? Number(state.additional||0) : (state.additional||'')};
  extra.querySelector('.plus').onclick=()=>{if(state.additionalDone)return;remember();state.additional=(Number(state.additional)||0)+1;save();renderGaps()};
  extra.querySelector('.minus').onclick=()=>{if(state.additionalDone)return;if((Number(state.additional)||0)>0){remember();state.additional--;}save();renderGaps()};
  extra.querySelector('.donebtn').onclick=()=>{remember();state.additionalDone=!state.additionalDone;save();renderGaps()};
  box.appendChild(extra);

  document.getElementById('storeTotal').textContent=total();
  updatePublish();
}

function goToMissingDetails(){
  const storeEl=document.getElementById('store');
  const scoreControl=document.getElementById('scoreControl');
  const validStore=/^\d{3,4}$/.test(state.store||'');
  const validScore=['1','2','3','4'].includes(state.score||'');

  storeEl.classList.toggle('storeerror',!validStore);
  scoreControl.classList.toggle('scoreerror',!validScore);

  if(!validStore){ensureVisible(storeEl,true);return false;}
  if(!validScore){ensureVisible(document.getElementById('scoreRow'),false);return false;}
  return true;
}

document.getElementById('undo').onclick=()=>{
  const previous=state.history.pop();
  if(!previous)return;
  redoHistory.push(snapshot());
  state.gaps={...previous.gaps};
  state.done={...previous.done};
  state.additional=Number(previous.additional)||0;
  state.additionalDone=!!previous.additionalDone;
  save();renderGaps();updateUndoRedo();
};

document.getElementById('redo').onclick=()=>{
  const next=redoHistory.pop();
  if(!next)return;
  state.history.push(snapshot());
  state.gaps={...next.gaps};
  state.done={...next.done};
  state.additional=Number(next.additional)||0;
  state.additionalDone=!!next.additionalDone;
  save();renderGaps();updateUndoRedo();
};

document.getElementById('reset').onclick=()=>document.getElementById('resetModal').classList.add('show');
function performReset(clearStore){
  const keepStore=state.store||'';
  state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:clearStore?'':keepStore,score:'',history:[],saved:null,done:{},additional:0,additionalDone:false};
  localStorage.setItem(KEY,JSON.stringify(state));
  location.reload();
}
document.getElementById('resetFigures').onclick=()=>performReset(false);
document.getElementById('resetAll').onclick=()=>performReset(true);
document.getElementById('resetCancel').onclick=()=>document.getElementById('resetModal').classList.remove('show');
document.getElementById('resetModal').onclick=e=>{if(e.target.id==='resetModal')e.currentTarget.classList.remove('show')};

document.getElementById('store').value=state.store||'';
document.getElementById('store').oninput=e=>{
  const v=e.target.value.replace(/\D/g,'').slice(0,4);
  e.target.value=v;
  state.store=v;
  e.target.classList.remove('storeerror');
  save();updatePublish();
};
document.getElementById('store').onfocus=e=>setTimeout(()=>ensureVisible(e.target,false),120);

document.querySelectorAll('.scorebtn').forEach(btn=>{
  btn.onclick=()=>{
    state.score=btn.dataset.score;
    document.getElementById('scoreControl').classList.remove('scoreerror');
    syncScoreUI();
    save();updatePublish();
  };
});

// Keep the active numeric field visible when the iPhone keyboard changes the viewport.
if(window.visualViewport){
  let keyboardTimer;
  window.visualViewport.addEventListener('resize',()=>{
    clearTimeout(keyboardTimer);
    keyboardTimer=setTimeout(()=>{
      const el=document.activeElement;
      if(el&&el.matches('input'))ensureVisible(el,false);
    },100);
  });
}

// Prevent accidental browser double-tap zoom on the app controls.
document.addEventListener('dblclick',e=>{
  if(e.target.closest('button,input'))e.preventDefault();
},{passive:false});

document.getElementById('publish').onclick=async()=>{
  const unfinished=AREAS.filter(a=>state.done[a]!==true);
  if(unfinished.length)return;
  if(!goToMissingDetails()){updatePublish();return;}

  const lines=[state.store||'','Score: '+(state.score||''),'Gaps: '+total(),''];
  AREAS.forEach(a=>lines.push(`${LABELS[a]} - ${state.gaps[a]}`));
  if((Number(state.additional)||0)>0)lines.push(`Additional Counts - ${state.additional}`);
  const text=lines.join('\n');

  try{
    if(navigator.share)await navigator.share({text});
    else{await navigator.clipboard.writeText(text);alert('Availability copied. Paste it into WhatsApp.')}
  }catch(e){
    if(e.name!=='AbortError')prompt('Copy Availability:',text);
  }
};

document.getElementById('formlink').onclick=()=>{
  // Google Forms pre-fill requires the company's hidden entry IDs. The public form URL
  // does not expose those IDs here, so keep this reliable rather than guessing them.
  window.location.href=SYS_FORM_URL;
};

syncScoreUI();
renderGaps();
updateUndoRedo();
if(state.saved)document.getElementById('status').textContent='Saved '+state.saved;
</script>
</body>
</html>
