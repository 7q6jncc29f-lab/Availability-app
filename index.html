<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Availability">
<title>Availability</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202b;background:#f3f6f8}
*{box-sizing:border-box} html,body,button,input,textarea{touch-action:manipulation} body{margin:0;background:#f3f6f8} header{background:#fff;padding:22px 16px 16px;border-bottom:1px solid #d8dee5;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:30px} main{padding:12px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid #d4dbe2;border-radius:16px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:19px;margin:0;padding:14px 16px;background:#e9eff5}.gaprow{display:grid;grid-template-columns:minmax(0,1fr) 48px 48px 48px 70px;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid #e4e8ec}
.area{font-weight:800;font-size:17px;min-width:0}.count{text-align:center;font-weight:800;font-size:23px}
.counter{height:48px;border:0;border-radius:12px;font-size:30px;font-weight:700}.minus{background:#f1f1f1;color:#2677e8}.plus{background:#e5f5e8;color:#17823b}.donebtn{height:48px;border:1px solid #d99a9a;border-radius:12px;background:#fff;color:#b42318;font-size:13px;font-weight:900}.gaprow{background:#fff0f0}.gaprow.done{background:#eef9f0}.gaprow.done .counter{opacity:.35}.gaprow.done .count{color:#17823b}.gaprow.done .donebtn{background:#17823b;color:#fff;border-color:#17823b}
.total{display:flex;justify-content:space-between;padding:14px 16px;font-size:20px;font-weight:900;border-top:2px solid #cfd6dc}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.toolbar button,.publish{min-height:48px;border:0;border-radius:12px;font-size:16px;font-weight:800}
.undo{background:#edf1f5}.publish{background:#1976d2;color:#fff;width:100%;margin-top:8px}.reset{background:#ffe9e9;color:#a71919}
.scorewrap{padding:12px 16px;border-bottom:1px solid #e3e7eb}.scorewrap label{font-weight:700;margin-right:8px}.scorewrap input{width:100px;padding:10px;border:1px solid #cfd6dc;border-radius:10px;font-size:18px}.scorewrap input.scoreerror{background:#ffe9e9;border:2px solid #c62828;color:#a71919}
.items{overflow-x:auto}.item{display:grid;grid-template-columns:1fr .85fr 1fr 1fr 1fr 1fr 1fr 1.35fr;gap:6px;padding:8px;border-top:1px solid #e5e8eb;min-width:680px}
.head{font-weight:800;background:#f5f7f9}.item input{width:100%;padding:10px 7px;border:1px solid #ccd4db;border-radius:8px;font-size:16px}.diff{text-align:center;font-weight:800;background:#f6f7f8}.pos{color:#16823a}.neg{color:#c62828}
textarea{width:calc(100% - 24px);margin:12px;min-height:110px;border:1px solid #ccd4db;border-radius:10px;padding:10px;font-size:16px}
.status{font-size:13px;text-align:center;color:#68727d;padding:4px 10px 18px}.formlink{display:block;background:#17823b;color:#fff;width:100%;min-height:58px;border:0;border-radius:12px;font-size:18px;font-weight:900;margin-top:10px}
@media(max-width:390px){.gaprow{grid-template-columns:minmax(0,1fr) 42px 38px 42px 62px;padding:9px 8px;gap:4px}.counter{height:44px}.area{font-size:16px}}

.resetmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100;align-items:center;justify-content:center;padding:20px}
.resetmodal.show{display:flex}.resetbox{width:min(420px,100%);background:#fff;border-radius:18px;padding:18px}
.resetbox h3{margin:0 0 14px;font-size:22px}.resetchoice{display:block;width:100%;min-height:58px;margin:10px 0;border:0;border-radius:12px;font-size:17px;font-weight:800;text-align:left;padding:0 16px}
.resetfigures{background:#edf1f5;color:#17202b}.resetall{background:#ffe9e9;color:#a71919}
.resetcancel{display:block;width:100%;min-height:48px;margin-top:8px;border:0;background:transparent;color:#1976d2;font-size:16px;font-weight:800}
</style>
</head>
<body>
<header><h1>Availability</h1></header>
<main>
<section class="card">
<h2>Gaps</h2>
<div class="scorewrap"><label for="store">Store:</label><input id="store" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
<div class="scorewrap"><label for="score">Score:</label><input id="score" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
<div id="gaps"></div>
<div class="total"><span>STORE TOTAL</span><span id="storeTotal">0</span></div>
<div style="padding:0 12px 12px"><button class="publish" id="publish">Publish Availability</button><button class="formlink" id="formlink">OPEN SYS FORM</button></div>
<div class="toolbar"><button class="undo" id="undo">Undo last gap</button><button class="reset" id="reset">Reset day</button></div>
</section>

<div class="status" id="status">Saved automatically on this iPhone.</div>
</main>

<div class="resetmodal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
<div class="resetbox"><h3 id="resetTitle">Reset options</h3>
<button class="resetchoice resetfigures" id="resetFigures">Reset figures</button>
<button class="resetchoice resetall" id="resetAll">Reset figures &amp; store number</button>
<button class="resetcancel" id="resetCancel">Cancel</button></div></div>

<script>
const AREAS=['AMBIENT','FV','CHILLER','BREAD','FREEZER','BAKERY','MEAT','CONV','MILK'];
const LABELS={AMBIENT:'Ambient',FV:'Fv',CHILLER:'Chiller',BREAD:'Bread',FREEZER:'Freezer',BAKERY:'Bakery',MEAT:'Meat',CONV:'Conv',MILK:'Milk'};
const KEY='availability-app-v2';
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state) state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:'',score:'',history:[],saved:null,done:{}};
AREAS.forEach(a=>{if(state.gaps[a]==null)state.gaps[a]=0});
if(!state.history)state.history=[];
if(!state.done)state.done={};

function stamp(){
 const d=new Date();
 state.saved=d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
 document.getElementById('status').textContent='Saved '+state.saved;
}
function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}
function total(){return AREAS.reduce((s,a)=>s+(Number(state.gaps[a])||0),0)}
function renderGaps(){
 const box=document.getElementById('gaps'); box.innerHTML='';
 AREAS.forEach(a=>{
  const row=document.createElement('div'); row.className='gaprow'+(state.done[a]?' done':'');
  row.innerHTML=`<div class="area">${LABELS[a]}</div><button class="counter minus" aria-label="Remove ${LABELS[a]} gap">−</button><div class="count">${state.gaps[a]}</div><button class="counter plus" aria-label="Add ${LABELS[a]} gap">+</button><button class="donebtn" aria-label="Toggle ${LABELS[a]} done">${state.done[a]?'✓ Counted':'✕ Not counted'}</button>`;
  row.querySelector('.plus').onclick=()=>{if(state.done[a])return;state.gaps[a]++;state.history.push(a);save();renderGaps()};
  row.querySelector('.minus').onclick=()=>{if(state.done[a])return;if(state.gaps[a]>0)state.gaps[a]--;save();renderGaps()};
   row.querySelector('.donebtn').onclick=()=>{state.done[a]=!state.done[a];save();renderGaps()};
  box.appendChild(row);
 });
 document.getElementById('storeTotal').textContent=total();
}
document.getElementById('undo').onclick=()=>{
 const a=state.history.pop(); if(a&&state.gaps[a]>0){state.gaps[a]--;save();renderGaps()}
};
document.getElementById('reset').onclick=()=>document.getElementById('resetModal').classList.add('show');
function performReset(clearStore){
 const keepStore=state.store||'';
 state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:clearStore?'':keepStore,score:'',history:[],saved:null,done:{}};
 localStorage.setItem(KEY,JSON.stringify(state));location.reload();
}
document.getElementById('resetFigures').onclick=()=>performReset(false);
document.getElementById('resetAll').onclick=()=>performReset(true);
document.getElementById('resetCancel').onclick=()=>document.getElementById('resetModal').classList.remove('show');
document.getElementById('resetModal').onclick=e=>{if(e.target.id==='resetModal')e.currentTarget.classList.remove('show')};

document.getElementById('store').value=state.store||'';
document.getElementById('store').oninput=e=>{state.store=e.target.value.replace(/\D/g,'');save()};
document.getElementById('score').value=state.score||'';
document.getElementById('score').oninput=e=>{
 const v=e.target.value.replace(/\D/g,'');e.target.value=v;
 if(v===''){e.target.classList.remove('scoreerror');state.score='';save();return;}
 if(!['1','2','3','4'].includes(v)){e.target.classList.add('scoreerror');state.score='';localStorage.setItem(KEY,JSON.stringify(state));return;}
 e.target.classList.remove('scoreerror');state.score=v;save();
};
document.getElementById('publish').onclick=async()=>{
 const unfinished=AREAS.filter(a=>!state.done[a]);
 if(unfinished.length){alert('Please mark every section as counted before publishing.');return;}
 const lines=[state.store||'','Score: '+(state.score||''),'Gaps: '+total(),''];
 AREAS.forEach(a=>lines.push(`${LABELS[a]} - ${state.gaps[a]}`));
 const text=lines.join('\n');
 let shareFinished=false;
 try{
  if(navigator.share){await navigator.share({text});shareFinished=true}
  else{await navigator.clipboard.writeText(text);alert('Availability copied. Paste it into WhatsApp.');shareFinished=true}
 }catch(e){if(e.name!=='AbortError'){prompt('Copy Availability:',text);shareFinished=true}}

};
document.getElementById('formlink').onclick=()=>{
 window.location.href='https://docs.google.com/forms/d/e/1FAIpQLScGUhe9fbjfRyEJb2WUhafWhEyVVs20PUDapUrmQK1-INcvKg/viewform?pli=1';
};

renderGaps();
if(state.saved)document.getElementById('status').textContent='Saved '+state.saved;
</script>
</body></html>
