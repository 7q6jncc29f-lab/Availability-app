<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Availability">
<title>Availability</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202b;background:#f3f6f8}
*{box-sizing:border-box} html,body,button,input,textarea{touch-action:manipulation} body{margin:0;background:#f3f6f8} header{background:#fff;padding:22px 16px 16px;border-bottom:1px solid #d8dee5;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:30px} main{padding:12px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid #d4dbe2;border-radius:16px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:19px;margin:0;padding:14px 16px;background:#e9eff5}.gaprow{display:grid;grid-template-columns:minmax(0,1fr) 54px 58px 54px;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid #e4e8ec}
.area{font-weight:800;font-size:17px;min-width:0}.count{text-align:center;font-weight:800;font-size:23px}
.counter{height:48px;border:0;border-radius:12px;font-size:30px;font-weight:700}.minus{background:#f1f1f1;color:#2677e8}.plus{background:#e5f5e8;color:#17823b}
.total{display:flex;justify-content:space-between;padding:14px 16px;font-size:20px;font-weight:900;border-top:2px solid #cfd6dc}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.toolbar button,.publish{min-height:48px;border:0;border-radius:12px;font-size:16px;font-weight:800}
.undo{background:#edf1f5}.publish{background:#1976d2;color:#fff;width:100%;margin-top:8px}.reset{background:#ffe9e9;color:#a71919}
.scorewrap{padding:12px 16px;border-bottom:1px solid #e3e7eb}.scorewrap label{font-weight:700;margin-right:8px}.scorewrap input{width:100px;padding:10px;border:1px solid #cfd6dc;border-radius:10px;font-size:18px}
.items{overflow-x:auto}.item{display:grid;grid-template-columns:1fr .85fr 1fr 1fr 1fr 1fr 1fr 1.35fr;gap:6px;padding:8px;border-top:1px solid #e5e8eb;min-width:680px}
.head{font-weight:800;background:#f5f7f9}.item input{width:100%;padding:10px 7px;border:1px solid #ccd4db;border-radius:8px;font-size:16px}.diff{text-align:center;font-weight:800;background:#f6f7f8}.pos{color:#16823a}.neg{color:#c62828}
textarea{width:calc(100% - 24px);margin:12px;min-height:110px;border:1px solid #ccd4db;border-radius:10px;padding:10px;font-size:16px}
.status{font-size:13px;text-align:center;color:#68727d;padding:4px 10px 18px}
@media(max-width:390px){.gaprow{grid-template-columns:minmax(0,1fr) 48px 52px 48px;padding:9px 8px;gap:4px}.counter{height:44px}.area{font-size:16px}}
</style>
</head>
<body>
<header><h1>Availability</h1></header>
<main>
<section class="card">
<h2>Gaps</h2>
<div class="scorewrap"><label for="score">Score:</label><input id="score" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
<div id="gaps"></div>
<div class="total"><span>STORE TOTAL</span><span id="storeTotal">0</span></div>
<div style="padding:0 12px 12px"><button class="publish" id="publish">Publish Availability</button></div>
<div class="toolbar"><button class="undo" id="undo">Undo last gap</button><button class="reset" id="reset">Reset day</button></div>
</section>

<section class="card">
<h2>Items to investigate</h2>
<div class="items" id="items">
<div class="item head"><div>Item code</div><div>£ Price</div><div>Stock file</div><div>Shop floor</div><div>Warehouse</div><div>Difference +/-</div><div>£ Value +/-</div><div>Findings / action</div></div>
</div>
</section>

<section class="card"><h2>Additional information</h2><textarea id="notes"></textarea><div style="padding:0 12px 12px"><button class="publish" id="publishInvestigation">Publish Investigation</button></div></section>
<div class="status" id="status">Saved automatically on this iPhone.</div>
</main>

<script>
const AREAS=['AMBIENT','FV','CHILLER','BREAD','FREEZER','BAKERY','MEAT','CONV','MILK'];
const LABELS={AMBIENT:'Ambient',FV:'Fv',CHILLER:'Chiller',BREAD:'Bread',FREEZER:'Freezer',BAKERY:'Bakery',MEAT:'Meat',CONV:'Conv',MILK:'Milk'};
const KEY='availability-app-v2';
const blankItem=()=>({code:'',price:'',stock:'',floor:'',warehouse:'',findings:''});
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state) state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),items:Array.from({length:12},blankItem),notes:'',score:'',history:[],saved:null};
AREAS.forEach(a=>{if(state.gaps[a]==null)state.gaps[a]=0});
if(!state.items)state.items=Array.from({length:12},blankItem);
state.items.forEach(it=>{if(it.price==null)it.price=''});
if(!state.history)state.history=[];

function stamp(){
 const d=new Date();
 state.saved=d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
 document.getElementById('status').textContent='Saved '+state.saved;
}
function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}
function total(){return AREAS.reduce((s,a)=>s+(Number(state.gaps[a])||0),0)}
function renderGaps(){
 const box=document.getElementById('gaps'); box.innerHTML='';
 AREAS.forEach(a=>{
  const row=document.createElement('div'); row.className='gaprow';
  row.innerHTML=`<div class="area">${a}</div><button class="counter minus" aria-label="Remove ${a} gap">−</button><div class="count">${state.gaps[a]}</div><button class="counter plus" aria-label="Add ${a} gap">+</button>`;
  row.querySelector('.plus').onclick=()=>{state.gaps[a]++;state.history.push(a);save();renderGaps()};
  row.querySelector('.minus').onclick=()=>{if(state.gaps[a]>0)state.gaps[a]--;save();renderGaps()};
  box.appendChild(row);
 });
 document.getElementById('storeTotal').textContent=total();
}
function num(v){return v===''?null:Number(v)}
function moneyValue(it){
 const d=calc(it),p=Number(String(it.price||'').replace(',','.'));
 if(d===''||!Number.isFinite(p)||it.price==='')return '';
 const v=Number(d)*p;
 return (v<0?'-£':v>0?'+£':'£')+Math.abs(v).toFixed(2);
}
function calc(it){
 const s=num(it.stock),f=num(it.floor),w=num(it.warehouse);
 if(s===null||f===null||w===null||[s,f,w].some(Number.isNaN))return '';
 const d=f+w-s; return d>0?'+'+d:String(d);
}
function renderItems(){
 const box=document.getElementById('items');
 box.querySelectorAll('.item:not(.head)').forEach(x=>x.remove());
 state.items.forEach((it,i)=>{
  const row=document.createElement('div');row.className='item';
  const fields=[['code','numeric'],['price','decimal'],['stock','numeric'],['floor','numeric'],['warehouse','numeric']];
  fields.forEach(([k,mode])=>{
   const inp=document.createElement('input');inp.value=it[k]||'';inp.inputMode=mode;inp.pattern=k==='price'?'[0-9]*[.,]?[0-9]*':'[0-9]*';inp.autocomplete='off';inp.enterKeyHint='done';
   inp.oninput=e=>{
    state.items[i][k]=k==='price'
      ? e.target.value.replace(/[^0-9.,]/g,'').replace(',','.')
      : e.target.value.replace(/\D/g,'');
    save();updateDiff(row,it)
   };
   row.appendChild(inp);
  });
  const d=document.createElement('input');d.readOnly=true;d.className='diff';row.appendChild(d);
  const val=document.createElement('input');val.readOnly=true;val.className='diff moneydiff';row.appendChild(val);
  const f=document.createElement('input');f.value=it.findings||'';f.enterKeyHint='done';f.oninput=e=>{state.items[i].findings=e.target.value;save()};row.appendChild(f);
  box.appendChild(row);updateDiff(row,it);
 });
}
function updateDiff(row,it){
 const d=row.querySelector('.diff'),v=calc(it);d.value=v;d.className='diff '+(v.startsWith('+')?'pos':v.startsWith('-')?'neg':'');
 const mv=row.querySelector('.moneydiff'),m=moneyValue(it);mv.value=m;mv.className='diff moneydiff '+(m.startsWith('+')?'pos':m.startsWith('-')?'neg':'');
}
document.getElementById('undo').onclick=()=>{
 const a=state.history.pop(); if(a&&state.gaps[a]>0){state.gaps[a]--;save();renderGaps()}
};
document.getElementById('reset').onclick=()=>{
 if(confirm("Reset today's Availability?")){
  state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),items:Array.from({length:12},blankItem),notes:'',score:'',history:[],saved:null};
  localStorage.setItem(KEY,JSON.stringify(state));location.reload();
 }
};
document.getElementById('score').value=state.score||'';
document.getElementById('score').oninput=e=>{state.score=e.target.value.replace(/\D/g,'');save()};
document.getElementById('notes').value=state.notes||'';
document.getElementById('notes').oninput=e=>{state.notes=e.target.value;save()};
document.getElementById('publish').onclick=async()=>{
 const lines=['1329','Score: '+(state.score||''),'Gaps: '+total(),''];
 AREAS.forEach(a=>lines.push(`${LABELS[a]} - ${state.gaps[a]}`));
 const text=lines.join('\n');
 try{
  if(navigator.share){await navigator.share({text})}
  else{await navigator.clipboard.writeText(text);alert('Availability copied. Paste it into WhatsApp.')}
 }catch(e){if(e.name!=='AbortError'){prompt('Copy Availability:',text)}}
};

document.getElementById('publishInvestigation').onclick=async()=>{
 const lines=[]; let n=0;
 const publishItems=state.items
  .filter(it=>it.code||it.price||it.stock||it.floor||it.warehouse||it.findings)
  .sort((a,b)=>{
   const av=Math.abs((Number(calc(a))||0)*(Number(String(a.price||'').replace(',','.'))||0));
   const bv=Math.abs((Number(calc(b))||0)*(Number(String(b.price||'').replace(',','.'))||0));
   return bv-av;
  });
 publishItems.forEach(it=>{
   n++;
   lines.push(
    n+'. Item code: '+(it.code||''),
    'Difference: '+calc(it),
    '£-value - '+moneyValue(it).replace('+£','£').replace('-£','-£'),
    'Findings / action: '+(it.findings||''),
    ''
   );
 });
 if(state.notes){lines.push('Additional information:',state.notes);}
 const text=lines.join('
');
 try{
  if(navigator.share){await navigator.share({text})}
  else{await navigator.clipboard.writeText(text);alert('Investigation copied. Paste it into WhatsApp.')}
 }catch(e){if(e.name!=='AbortError'){prompt('Copy Investigation:',text)}}
};

renderGaps();renderItems();
if(state.saved)document.getElementById('status').textContent='Saved '+state.saved;
</script>
</body></html>
