<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Availability">
<title>Availability</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202b;background:#f3f6f8}
*{box-sizing:border-box} html,body,button,input,textarea{touch-action:manipulation} body{margin:0;background:#f3f6f8} header{background:#fff;padding:22px 16px 16px;border-bottom:1px solid #d8dee5;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:30px} main{padding:12px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid #d4dbe2;border-radius:16px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:19px;margin:0;padding:14px 16px;background:#e9eff5}.gaprow{display:grid;grid-template-columns:minmax(0,1fr) 62px 72px 62px 58px;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid #e4e8ec}
.area{font-weight:800;font-size:17px;min-width:0}.count{text-align:center;font-weight:800;font-size:23px}.gapinput{width:100%;height:48px;padding:0 1px;border:2px solid #1976d2;border-radius:10px;text-align:center;font-weight:800;font-size:15px;background:#fff;color:#17202b}.editwrap{position:relative;width:100%;height:48px}.editwrap input{position:absolute;inset:0}.editcue{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:7px;font-weight:800;color:#1976d2;pointer-events:none}.editcue span{display:block;line-height:8px;white-space:nowrap}.editwrap.hasvalue .editcue{display:none}
.counter{height:54px;border:0;border-radius:12px;font-size:38px;font-weight:800}.minus{background:#f1f1f1;color:#2677e8}.plus{background:#e5f5e8;color:#17823b}.donebtn{height:48px;border:1px solid #d99a9a;border-radius:12px;background:#fff;color:#b42318;font-size:11px;font-weight:900;padding:0 3px}.gaprow{background:#fff0f0}.gaprow.done{background:#eef9f0}.gaprow.done .counter{opacity:.35}.gaprow.done .count{color:#17823b}.gaprow.done .donebtn{background:#17823b;color:#fff;border-color:#17823b}.additionalrow{background:#fff}.additionalrow .spacer{height:48px}.additionalinput{width:100%;height:48px;padding:0 1px;border:3px solid #1976d2;border-radius:10px;text-align:center;font-weight:800;font-size:17px;background:#fff;color:#17202b;box-shadow:inset 0 0 0 1px #d7e8fb}
.total{display:flex;justify-content:space-between;padding:14px 16px;font-size:20px;font-weight:900;border-top:2px solid #cfd6dc}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.toolbar button,.publish{min-height:48px;border:0;border-radius:12px;font-size:16px;font-weight:800}
.undo{background:#edf1f5}.publish{background:#1976d2;color:#fff;width:100%;margin-top:8px}.publish:disabled{background:#aeb8c2;color:#eef1f4;opacity:1}.reset{background:#ffe9e9;color:#a71919}
.scorewrap{padding:12px 16px;border-bottom:1px solid #e3e7eb}.scorewrap label{font-weight:700;margin-right:8px}.scorewrap input{width:100px;padding:10px;border:1px solid #cfd6dc;border-radius:10px;font-size:18px}.scorewrap input.scoreerror,.scorewrap input.storeerror{background:#ffe9e9;border:2px solid #c62828;color:#a71919}
.items{overflow-x:auto}.item{display:grid;grid-template-columns:1fr .85fr 1fr 1fr 1fr 1fr 1fr 1.35fr;gap:6px;padding:8px;border-top:1px solid #e5e8eb;min-width:680px}
.head{font-weight:800;background:#f5f7f9}.item input{width:100%;padding:10px 7px;border:1px solid #ccd4db;border-radius:8px;font-size:16px}.diff{text-align:center;font-weight:800;background:#f6f7f8}.pos{color:#16823a}.neg{color:#c62828}
textarea{width:calc(100% - 24px);margin:12px;min-height:110px;border:1px solid #ccd4db;border-radius:10px;padding:10px;font-size:16px}
.status{font-size:13px;text-align:center;color:#68727d;padding:4px 10px 18px}.formlink{display:block;background:#17823b;color:#fff;width:100%;min-height:58px;border:0;border-radius:12px;font-size:18px;font-weight:900;margin-top:10px}
@media(max-width:390px){.gaprow{grid-template-columns:minmax(0,1fr) 58px 68px 58px 54px;padding:9px 8px;gap:4px}.counter{height:50px;font-size:36px}.area{font-size:16px}}

.resetmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100;align-items:center;justify-content:center;padding:20px}
.resetmodal.show{display:flex}.resetbox{width:min(420px,100%);background:#fff;border-radius:18px;padding:18px}
.resetbox h3{margin:0 0 14px;font-size:22px}.resetchoice{display:block;width:100%;min-height:58px;margin:10px 0;border:0;border-radius:12px;font-size:17px;font-weight:800;text-align:left;padding:0 16px}
.resetfigures{background:#edf1f5;color:#17202b}.resetall{background:#ffe9e9;color:#a71919}
.resetcancel{display:block;width:100%;min-height:48px;margin-top:8px;border:0;background:transparent;color:#1976d2;font-size:16px;font-weight:800}
</style>
</head>
<body>
<header><h1>Availability</h1></header>
<main>
<section class="card">
<h2>Gaps</h2>
<div class="scorewrap"><label for="store">Store:</label><input id="store" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
<div class="scorewrap"><label for="score">Score:</label><input id="score" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
<div id="gaps"></div>
<div class="total"><span>STORE TOTAL</span><span id="storeTotal">0</span></div>
<div style="padding:0 12px 12px"><button class="publish" id="publish">Publish Availability</button><button class="formlink" id="formlink">OPEN SYS FORM</button></div>
<div class="toolbar"><button class="undo" id="undo">Undo</button><button class="reset" id="reset">Reset day</button></div>
</section>

<div class="status" id="status">Saved automatically on this iPhone.</div>
</main>

<div class="resetmodal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
<div class="resetbox"><h3 id="resetTitle">Reset options</h3>
<button class="resetchoice resetfigures" id="resetFigures">Reset figures</button>
<button class="resetchoice resetall" id="resetAll">Reset figures &amp; store number</button>
<button class="resetcancel" id="resetCancel">Cancel</button></div></div>

<script>
const AREAS=['AMBIENT','FV','CHILLER','BREAD','FREEZER','BAKERY','MEAT','CONV','MILK'];
const LABELS={AMBIENT:'Ambient',FV:'Fv',CHILLER:'Chiller',BREAD:'Bread',FREEZER:'Freezer',BAKERY:'Bakery',MEAT:'Meat',CONV:'Conv',MILK:'Milk'};
const KEY='availability-app-v2';
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state) state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:'',score:'',history:[],saved:null,done:{}};
AREAS.forEach(a=>{if(state.gaps[a]==null)state.gaps[a]=0});
if(!state.history)state.history=[];
if(!state.done)state.done={};
if(state.additional==null)state.additional=0;
if(state.additionalDone==null)state.additionalDone=false;

function stamp(){
 const d=new Date();
 state.saved=d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
 document.getElementById('status').textContent='Saved '+state.saved;
}
function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}
function remember(){
 state.history.push({
  gaps:{...state.gaps},
  done:{...state.done},
  additional:Number(state.additional)||0,
  additionalDone:!!state.additionalDone
 });
 if(state.history.length>50)state.history.shift();
}
function total(){return AREAS.reduce((s,a)=>s+(Number(state.gaps[a])||0),0)}
function updatePublish(){
 const allCounted=AREAS.every(a=>state.done[a]===true);
 const store=state.store||'';
 const score=state.score||'';
 const validStore=/^\d{3,4}$/.test(store);
 const validScore=['1','2','3','4'].includes(score);
 const btn=document.getElementById('publish');

 // Keep button tappable when fields are wrong so tapping it can highlight them red.
 btn.disabled=!allCounted;

 if(!allCounted){btn.textContent='Count all sections to publish';return;}
 if(!store && !score){btn.textContent='Enter store number & score';return;}
 if(!store){btn.textContent='Enter store number';return;}
 if(!validStore){btn.textContent='Store number must be 3–4 digits';return;}
 if(!score){btn.textContent='Enter score';return;}
 if(!validScore){btn.textContent='Score must be 1–4';return;}
 btn.textContent='Publish Availability';
}
const lockedTapCounts={};
function lockedCounterTap(area){
 if(!state.done[area])return false;
 lockedTapCounts[area]=(lockedTapCounts[area]||0)+1;
 if(lockedTapCounts[area]>=2){
  lockedTapCounts[area]=0;
  remember();state.done[area]=false;
  save();renderGaps();
 }
 return true;
}
function renderGaps(){
 const box=document.getElementById('gaps'); box.innerHTML='';
 AREAS.forEach(a=>{
  const row=document.createElement('div'); row.className='gaprow'+(state.done[a]?' done':'');
  row.innerHTML=`<div class="area">${LABELS[a]}</div><button class="counter minus">−</button><div class="editwrap ${state.done[a] || state.gaps[a]?'hasvalue':''}"><input class="gapinput" inputmode="numeric" pattern="[0-9]*" placeholder=" " value="${state.done[a] ? Number(state.gaps[a]||0) : (state.gaps[a]||'')}" ${state.done[a]?'disabled':''}>${state.done[a]?'':`<span class="editcue"><span>Tap</span><span>To</span><span>Edit</span></span>`}</div><button class="counter plus">+</button><button class="donebtn">${state.done[a]?'✓ Counted':'✕ Not counted'}</button>`;
  const gapInput=row.querySelector('.gapinput');
  gapInput.onfocus=()=>{if(!state.done[a])gapInput.dataset.before=String(state.gaps[a]||0)};gapInput.oninput=()=>{if(state.done[a])return;const v=gapInput.value.replace(/\D/g,'');gapInput.value=v;if(!gapInput.dataset.remembered&&Number(v||0)!==Number(gapInput.dataset.before||0)){remember();gapInput.dataset.remembered='1'}state.gaps[a]=v===''?0:Number(v);gapInput.parentElement.classList.toggle('hasvalue',v!=='');save();document.getElementById('storeTotal').textContent=total()};
  gapInput.onblur=()=>{gapInput.value=state.done[a] ? Number(state.gaps[a]||0) : (state.gaps[a]||'')};
  row.querySelector('.plus').onclick=()=>{if(lockedCounterTap(a))return;remember();state.gaps[a]++;save();renderGaps()};
  row.querySelector('.minus').onclick=()=>{if(lockedCounterTap(a))return;if(state.gaps[a]>0){remember();state.gaps[a]--;}save();renderGaps()};
  row.querySelector('.donebtn').onclick=()=>{lockedTapCounts[a]=0;remember();state.done[a]=!state.done[a];save();renderGaps()};
  box.appendChild(row);
 });
 const extra=document.createElement('div');
 extra.className='gaprow additionalrow'+(state.additionalDone?' done':'');
 extra.innerHTML=`<div class="area">Additional Counts</div><button class="counter minus">−</button><div class="editwrap ${state.additionalDone || state.additional?'hasvalue':''}"><input class="additionalinput" inputmode="numeric" pattern="[0-9]*" placeholder=" " value="${state.additionalDone ? Number(state.additional||0) : (state.additional||'')}" ${state.additionalDone?'disabled':''}>${state.additionalDone?'':`<span class="editcue"><span>Tap</span><span>To</span><span>Edit</span></span>`}</div><button class="counter plus">+</button><button class="donebtn">${state.additionalDone?'✓ Done':'✕ Not done'}</button>`;
 const extraInput=extra.querySelector('.additionalinput');
 extraInput.onfocus=()=>{if(!state.additionalDone)extraInput.dataset.before=String(state.additional||0)};extraInput.oninput=()=>{if(state.additionalDone)return;const v=extraInput.value.replace(/\D/g,'');extraInput.value=v;if(!extraInput.dataset.remembered&&Number(v||0)!==Number(extraInput.dataset.before||0)){remember();extraInput.dataset.remembered='1'}state.additional=v===''?0:Number(v);extraInput.parentElement.classList.toggle('hasvalue',v!=='');save()};
 extraInput.onblur=()=>{extraInput.value=state.additionalDone ? Number(state.additional||0) : (state.additional||'')};
 extra.querySelector('.plus').onclick=()=>{if(state.additionalDone)return;remember();state.additional=(Number(state.additional)||0)+1;save();renderGaps()};
 extra.querySelector('.minus').onclick=()=>{if(state.additionalDone)return;if((Number(state.additional)||0)>0){remember();state.additional--;}save();renderGaps()};
 extra.querySelector('.donebtn').onclick=()=>{remember();state.additionalDone=!state.additionalDone;save();renderGaps()};
 box.appendChild(extra);
 document.getElementById('storeTotal').textContent=total();
 updatePublish();
}
document.getElementById('undo').onclick=()=>{
 const previous=state.history.pop();
 if(!previous)return;
 state.gaps={...previous.gaps};
 state.done={...previous.done};
 state.additional=Number(previous.additional)||0;
 state.additionalDone=!!previous.additionalDone;
 save();renderGaps();
};
document.getElementById('reset').onclick=()=>document.getElementById('resetModal').classList.add('show');
function performReset(clearStore){
 const keepStore=state.store||'';
 state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:clearStore?'':keepStore,score:'',history:[],saved:null,done:{},additional:0,additionalDone:false};
 localStorage.setItem(KEY,JSON.stringify(state));location.reload();
}
document.getElementById('resetFigures').onclick=()=>performReset(false);
document.getElementById('resetAll').onclick=()=>performReset(true);
document.getElementById('resetCancel').onclick=()=>document.getElementById('resetModal').classList.remove('show');
document.getElementById('resetModal').onclick=e=>{if(e.target.id==='resetModal')e.currentTarget.classList.remove('show')};

document.getElementById('store').value=state.store||'';
document.getElementById('store').oninput=e=>{
 const v=e.target.value.replace(/\D/g,'').slice(0,4);
 e.target.value=v;state.store=v;e.target.classList.remove('storeerror');
 save();updatePublish();
};
document.getElementById('score').value=state.score||'';
document.getElementById('score').oninput=e=>{
 const v=e.target.value.replace(/\D/g,'').slice(0,1);
 e.target.value=v;state.score=v;e.target.classList.remove('scoreerror');
 save();updatePublish();
};
document.getElementById('publish').onclick=async()=>{
 const unfinished=AREAS.filter(a=>state.done[a]!==true);
 if(unfinished.length)return;

 const storeEl=document.getElementById('store');
 const scoreEl=document.getElementById('score');
 const validStore=/^\d{3,4}$/.test(state.store||'');
 const validScore=['1','2','3','4'].includes(state.score||'');

 storeEl.classList.toggle('storeerror',!validStore);
 scoreEl.classList.toggle('scoreerror',!validScore);
 updatePublish();
 if(!validStore||!validScore)return;

 const lines=[state.store||'','Score: '+(state.score||''),'Gaps: '+total(),''];
 AREAS.forEach(a=>lines.push(`${LABELS[a]} - ${state.gaps[a]}`));
 if((Number(state.additional)||0)>0)lines.push(`Additional Counts - ${state.additional}`);
 const text=lines.join('\n');
 let shareFinished=false;
 try{
  if(navigator.share){await navigator.share({text});shareFinished=true}
  else{await navigator.clipboard.writeText(text);alert('Availability copied. Paste it into WhatsApp.');shareFinished=true}
 }catch(e){if(e.name!=='AbortError'){prompt('Copy Availability:',text);shareFinished=true}}

};
document.getElementById('formlink').onclick=()=>{
 window.location.href='https://docs.google.com/forms/d/e/1FAIpQLScGUhe9fbjfRyEJb2WUhafWhEyVVs20PUDapUrmQK1-INcvKg/viewform?pli=1';
};

renderGaps();
if(state.saved)document.getElementById('status').textContent='Saved '+state.saved;
</script>
</body></html>
