<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Availability">
<meta name="theme-color" content="#f3f6f8">
<title>Availability</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#17202b;
  background:#f3f6f8;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f6f8;touch-action:manipulation}
body{padding-bottom:max(8px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer}
button:active:not(:disabled){transform:scale(.985)}

header{
  background:rgba(255,255,255,.96);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid #d8dee5;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
}
h1{margin:0;font-size:24px;line-height:1.1;letter-spacing:-.35px}
main{padding:8px;max-width:760px;margin:auto}
.card{background:#fff;border:1px solid #d4dbe2;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 2px rgba(17,32,49,.04)}
.card h2{font-size:16px;line-height:1.2;margin:0;padding:10px 12px;background:#e9eff5}

.setup{border-bottom:1px solid #e3e7eb;background:#fff}
.fieldrow{display:grid;grid-template-columns:68px minmax(0,1fr);align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #eef1f4}
.fieldrow:first-child{border-top:0}
.fieldrow label,.fieldlabel{font-weight:800;font-size:14px}
.storeinput{
  width:112px;
  height:42px;
  padding:0 11px;
  border:1.5px solid #cbd4dd;
  border-radius:10px;
  font-size:18px;
  font-weight:700;
  background:#fff;
  color:#17202b;
  outline:none;
}
.storeinput:focus{border-color:#1976d2;box-shadow:0 0 0 3px rgba(25,118,210,.12)}
.storeinput.storeerror{background:#fff0f0;border-color:#c62828;color:#9f1d1d;box-shadow:0 0 0 3px rgba(198,40,40,.08)}
.scorecontrol{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:268px}
.scorebtn{
  min-width:0;
  height:42px;
  border:1.5px solid #cbd4dd;
  border-radius:10px;
  background:#fff;
  color:#34404c;
  font-size:17px;
  font-weight:900;
}
.scorebtn.selected{background:#1976d2;border-color:#1976d2;color:#fff;box-shadow:0 2px 6px rgba(25,118,210,.2)}
.scorecontrol.scoreerror{border-radius:12px;box-shadow:0 0 0 3px rgba(198,40,40,.12)}
.fieldlabel#scoreLabel{cursor:pointer;-webkit-user-select:none;user-select:none}
.reasonpanel{display:none;padding:10px 12px 12px 90px;border-top:1px solid #eef1f4;background:#f8fafc}
.reasonpanel.show{display:block}
.reasonhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.reasonhead strong{font-size:14px}
.reasonrequired{font-size:11px;font-weight:850;color:#a9221a;background:#ffe8e8;padding:3px 7px;border-radius:999px}
.scorereasoninput{width:100%;height:44px;border:1.5px solid #cbd4dd;border-radius:10px;padding:0 11px;background:#fff;color:#17202b;outline:none;font-size:15px}
.scorereasoninput:focus{border-color:#1976d2;box-shadow:0 0 0 3px rgba(25,118,210,.12)}
.scorereasoninput.reasonerror{background:#fff0f0;border-color:#c62828;box-shadow:0 0 0 3px rgba(198,40,40,.08)}
.reasonfooter{display:flex;justify-content:space-between;gap:10px;margin-top:6px;color:#68727d;font-size:11px}
.scoreguidemodal{
  display:none;
  position:fixed;
  inset:0;
  z-index:110;
  background:#111;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.scoreguidemodal.show{display:flex}
.scoreguidebox{
  width:100vw;
  height:100vh;
  max-width:none;
  max-height:none;
  background:#fff;
  border-radius:0;
  overflow:hidden;
  box-shadow:none;
  display:flex;
  flex-direction:column;
}
.scoreguidehead{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:#fff;
  border-bottom:1px solid #d8dee5;
}
.scoreguidehead h3{margin:0;font-size:18px}
.scoreguideclose{
  min-height:36px;
  border:0;
  border-radius:9px;
  background:#1976d2;
  color:#fff;
  padding:0 14px;
  font-weight:850;
}
.scoreguideimg{
  display:block;
  flex:1 1 auto;
  min-height:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#fff;
}

/* Score guide is always presented as landscape. On browsers that cannot
   programmatically lock orientation, portrait mode is rotated as a fallback. */
@media (orientation:portrait){
  .scoreguidebox{
    position:absolute;
    left:50%;
    top:50%;
    width:100vh;
    height:100vw;
    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;
  }
  .scoreguidehead{
    padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
  }
}


.gaprow{
  display:grid;
  grid-template-columns:minmax(78px,1fr) 44px 56px 44px 66px;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-top:1px solid #e4e8ec;
  background:#fff1f1;
  transition:background .12s ease;
}
.area{font-weight:850;font-size:15px;line-height:1.08;min-width:0;letter-spacing:-.1px}
.counter{
  width:44px;
  height:46px;
  border:0;
  border-radius:11px;
  font-size:29px;
  line-height:1;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}
.minus{background:#edf3f8;color:#2378d6}
.plus{background:#e5f5e8;color:#16823a}
.editwrap{position:relative;width:56px;height:46px}
.gapinput,.additionalinput{
  width:100%;
  height:46px;
  padding:0 2px;
  border:2px solid #1976d2;
  border-radius:10px;
  text-align:center;
  font-weight:850;
  font-size:18px;
  background:#fff;
  color:#17202b;
  outline:none;
  font-variant-numeric:tabular-nums;
}
.gapinput:focus,.additionalinput:focus{box-shadow:0 0 0 3px rgba(25,118,210,.15)}
.editcue{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.2px;
  color:#1976d2;
  pointer-events:none;
  text-transform:uppercase;
}
.editwrap.hasvalue .editcue{display:none}
.donebtn{
  min-width:0;
  width:66px;
  height:46px;
  border:1px solid #d89797;
  border-radius:11px;
  background:#fff;
  color:#a9221a;
  font-size:9.5px;
  line-height:1.05;
  font-weight:900;
  padding:0 3px;
}
.gaprow.done{background:#edf8ef}
.gaprow.done .counter{opacity:.28}
.gaprow.done .gapinput,.gaprow.done .additionalinput{border-color:#9fc8a7;background:#f9fffa;color:#167b38}
.gaprow.done .donebtn{background:#17823b;color:#fff;border-color:#17823b}
.additionalrow{background:#f8fafb;border-top:2px solid #d9e0e6}
.additionalrow.done{background:#edf8ef}

.total{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px 9px 12px;
  font-size:18px;
  font-weight:900;
  border-top:2px solid #cfd6dc;
  background:#fff;
  font-variant-numeric:tabular-nums;
}
.totalleft{display:flex;align-items:baseline;gap:14px;min-width:0}
.totalleft #storeTotal{font-size:22px;min-width:28px;text-align:left}
.completeall{
  flex:0 0 auto;
  min-width:118px;
  min-height:40px;
  border:1px solid #b9d9bf;
  border-radius:10px;
  background:#edf8ef;
  color:#167b38;
  padding:0 12px;
  font-size:13px;
  font-weight:900;
}
.completeall:disabled{opacity:1;background:#e8f4ea;color:#167b38;border-color:#c4dfc9}
.actions{padding:9px 10px 10px;background:#fff}
.publish,.formlink{width:100%;min-height:50px;border:0;border-radius:11px;font-size:15px;font-weight:900;letter-spacing:.05px}
.publish{background:#1976d2;color:#fff}
.publish:disabled{background:#b7c0c8;color:#f4f6f8;opacity:1;cursor:default}
.formlink{display:block;background:#17823b;color:#fff;margin-top:8px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 10px 10px;background:#fff}
.toolbar button{min-height:44px;border:0;border-radius:10px;font-size:14px;font-weight:850}
.undo,.redo{background:#edf1f5;color:#1976d2}
.redo{display:none}
.undoredowrap{display:grid;grid-template-columns:1fr;gap:7px}
.undoredowrap.hasredo{grid-template-columns:1fr 1fr}
.undoredowrap.hasredo .redo{display:block}
.reset{background:#ffe8e8;color:#a71919}
.status{font-size:12px;text-align:center;color:#68727d;padding:2px 10px 10px}

/* Custom number pad: avoids the iPhone keyboard resizing the visual viewport. */
.customkeypad{
  display:none;
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:95;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(37,41,46,.96);
  border-top:1px solid rgba(255,255,255,.12);
  box-shadow:0 -10px 28px rgba(0,0,0,.20);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
}
body.keypad-open .customkeypad{display:block}
body.keypad-open main{padding-bottom:calc(300px + env(safe-area-inset-bottom))}
.keypadtop{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:520px;margin:0 auto 7px}
.keypadlabel{color:#fff;font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keypadhide{height:34px;min-width:66px;padding:0 12px;border:0;border-radius:9px;background:#53585e;color:#fff;font-size:13px;font-weight:850}
.keypadgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:520px;margin:auto}
.keypadkey{height:52px;border:0;border-radius:11px;background:#5c6064;color:#fff;font-size:25px;font-weight:700;line-height:1}
.keypadkey.backspace{font-size:22px;background:#4b5055}
.keypadkey.enter{font-size:16px;font-weight:900;background:#1976d2}
.keypadkey:active{transform:scale(.985);filter:brightness(1.08)}
.gapinput[readonly],.additionalinput[readonly]{
  caret-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  cursor:pointer;
}
.gapinput.customactive,.additionalinput.customactive{box-shadow:0 0 0 4px rgba(25,118,210,.20)}

.resetmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;align-items:flex-end;justify-content:center;padding:12px}
.resetmodal.show{display:flex}
.resetbox{width:min(480px,100%);background:#fff;border-radius:18px 18px 14px 14px;padding:16px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.16)}
.resetbox h3{margin:0 0 12px;font-size:20px}
.resetchoice{display:block;width:100%;min-height:54px;margin:8px 0;border:0;border-radius:11px;font-size:16px;font-weight:850;text-align:left;padding:0 14px}
.resetfigures{background:#edf1f5;color:#17202b}.resetall{background:#ffe9e9;color:#a71919}
.resetcancel{display:block;width:100%;min-height:46px;margin-top:5px;border:0;background:transparent;color:#1976d2;font-size:16px;font-weight:850}

@media(max-width:390px){
  main{padding:6px}
  .gaprow{grid-template-columns:minmax(70px,1fr) 42px 53px 42px 62px;gap:4px;padding:6px 7px}
  .counter{width:42px;height:44px;font-size:27px}
  .editwrap,.gapinput,.additionalinput{height:44px}.editwrap{width:53px}
  .area{font-size:14px}
  .donebtn{width:62px;height:44px;font-size:9px}
  .scorecontrol{max-width:none}
  .reasonpanel{padding-left:12px}
  .total{padding-left:9px;padding-right:8px;gap:7px}
  .totalleft{gap:10px}
  .totalleft #storeTotal{font-size:21px}
  .completeall{min-width:104px;padding:0 9px;font-size:12px}
}
@media(max-width:350px){
  .gaprow{grid-template-columns:minmax(64px,1fr) 40px 49px 40px 58px;gap:3px;padding-left:5px;padding-right:5px}
  .counter{width:40px}
  .editwrap{width:49px}
  .donebtn{width:58px;font-size:8.4px}
}
</style>
</head>
<body>
<header><h1>Availability</h1></header>
<main>
<section class="card">
  <h2>Gaps</h2>
  <div class="setup">
    <div class="fieldrow" id="storeRow">
      <label for="store">Store</label>
      <input class="storeinput" id="store" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="done" aria-label="Store number">
    </div>
    <div class="fieldrow" id="scoreRow">
      <div class="fieldlabel" id="scoreLabel" title="Triple tap for score guide">Score</div>
      <div class="scorecontrol" id="scoreControl" role="group" aria-label="Score from 1 to 4">
        <button type="button" class="scorebtn" data-score="1" aria-pressed="false">1</button>
        <button type="button" class="scorebtn" data-score="2" aria-pressed="false">2</button>
        <button type="button" class="scorebtn" data-score="3" aria-pressed="false">3</button>
        <button type="button" class="scorebtn" data-score="4" aria-pressed="false">4</button>
      </div>
    </div>
    <div class="reasonpanel" id="reasonPanel">
      <div class="reasonhead">
        <strong id="reasonTitle">Reason for score</strong>
        <span class="reasonrequired">Required</span>
      </div>
      <input class="scorereasoninput" id="scoreReason" maxlength="120" autocomplete="off" placeholder="e.g. 2 pallets of delivery left" aria-label="Reason for score">
      <div class="reasonfooter">
        <span>Added beside the score when published</span>
        <span id="reasonCount">0/120</span>
      </div>
    </div>
  </div>

  <div id="gaps"></div>
  <div class="total">
    <div class="totalleft"><span>STORE TOTAL</span><span id="storeTotal">0</span></div>
    <button class="completeall" id="completeAll">Complete all</button>
  </div>

  <div class="actions">
    <button class="publish" id="publish">Publish Availability</button>
    <button class="formlink" id="formlink">OPEN SYS FORM</button>
  </div>
  <div class="toolbar">
    <div class="undoredowrap" id="undoRedoWrap">
      <button class="undo" id="undo">Undo</button>
      <button class="redo" id="redo">Redo</button>
    </div>
    <button class="reset" id="reset">Reset day</button>
  </div>
</section>
<div class="status" id="status">Saved automatically on this iPhone.</div>
</main>

<div class="customkeypad" id="customKeypad" aria-hidden="true">
  <div class="keypadtop">
    <div class="keypadlabel" id="keypadLabel">Enter count</div>
    <button type="button" class="keypadhide" id="keypadHide">Hide</button>
  </div>
  <div class="keypadgrid" id="keypadGrid">
    <button type="button" class="keypadkey" data-key="1">1</button>
    <button type="button" class="keypadkey" data-key="2">2</button>
    <button type="button" class="keypadkey" data-key="3">3</button>
    <button type="button" class="keypadkey" data-key="4">4</button>
    <button type="button" class="keypadkey" data-key="5">5</button>
    <button type="button" class="keypadkey" data-key="6">6</button>
    <button type="button" class="keypadkey" data-key="7">7</button>
    <button type="button" class="keypadkey" data-key="8">8</button>
    <button type="button" class="keypadkey" data-key="9">9</button>
    <button type="button" class="keypadkey backspace" data-key="backspace" aria-label="Backspace">⌫</button>
    <button type="button" class="keypadkey" data-key="0">0</button>
    <button type="button" class="keypadkey enter" data-key="enter" id="keypadEnter">Enter ↓</button>
  </div>
</div>

<div class="resetmodal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
  <div class="resetbox">
    <h3 id="resetTitle">Reset options</h3>
    <button class="resetchoice resetfigures" id="resetFigures">Reset figures</button>
    <button class="resetchoice resetall" id="resetAll">Reset figures &amp; store number</button>
    <button class="resetcancel" id="resetCancel">Cancel</button>
  </div>
</div>

<div class="scoreguidemodal" id="scoreGuideModal" role="dialog" aria-modal="true" aria-labelledby="scoreGuideTitle">
  <div class="scoreguidebox">
    <div class="scoreguidehead">
      <h3 id="scoreGuideTitle">Score guide</h3>
      <button type="button" class="scoreguideclose" id="scoreGuideClose">Done</button>

AAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcXAUAAAAAAHByFQAAAAAAwMlVAAAAAAAAJ1cBAAAAAACcAtE/Lolsqj0JAAAAAElFTkSuQmCC" alt="Store score guide showing the criteria for scores 1 to 4">
  </div>
</div>

<script>
const AREAS=['AMBIENT','FV','CHILLER','BREAD','FREEZER','BAKERY','MEAT','CONV','MILK'];
const LABELS={AMBIENT:'Ambient',FV:'Fv',CHILLER:'Chiller',BREAD:'Bread',FREEZER:'Freezer',BAKERY:'Bakery',MEAT:'Meat',CONV:'Conv',MILK:'Milk'};
const KEY='availability-app-v2';
const SYS_FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLScGUhe9fbjfRyEJb2WUhafWhEyVVs20PUDapUrmQK1-INcvKg/viewform?pli=1';

let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state) state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:'',score:'',history:[],saved:null,done:{}};
AREAS.forEach(a=>{if(state.gaps[a]==null)state.gaps[a]=0});
if(!state.history)state.history=[];
if(!state.done)state.done={};
if(state.additional==null)state.additional=0;
if(state.additionalDone==null)state.additionalDone=false;
if(!['1','2','3','4'].includes(String(state.score||'')))state.score='';
if(state.scoreReason==null)state.scoreReason='';
let redoHistory=[];

function stamp(){
  const d=new Date();
  state.saved=d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  document.getElementById('status').textContent='Saved '+state.saved;
}
function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}
function snapshot(){return {gaps:{...state.gaps},done:{...state.done},additional:Number(state.additional)||0,additionalDone:!!state.additionalDone}}
function updateUndoRedo(){
  const wrap=document.getElementById('undoRedoWrap');
  if(wrap)wrap.classList.toggle('hasredo',redoHistory.length>0);
}
function remember(){
  redoHistory=[];
  state.history.push({gaps:{...state.gaps},done:{...state.done},additional:Number(state.additional)||0,additionalDone:!!state.additionalDone});
  if(state.history.length>50)state.history.shift();
}
function total(){return AREAS.reduce((s,a)=>s+(Number(state.gaps[a])||0),0)}

function scoreGapMessage(score,gapTotal){
  const s=String(score||'');
  const gaps=Number(gapTotal)||0;
  if(gaps>=36&&(s==='3'||s==='4'))return 'More than 35 gaps cannot be scored higher than 2.';
  if(gaps>=21&&s==='4')return '21 gaps or more cannot be scored higher than 3.';
  return '';
}

function syncScoreUI(){
  document.querySelectorAll('.scorebtn').forEach(btn=>{
    const selected=btn.dataset.score===String(state.score||'');
    btn.classList.toggle('selected',selected);
    btn.setAttribute('aria-pressed',selected?'true':'false');
  });
}

function needsScoreReason(){
  return state.score==='1'||state.score==='2';
}

function cleanScoreReason(){
  return String(state.scoreReason||'').trim().replace(/\s+/g,' ');
}

function applyAutomaticScoreReason(){
  if(state.score==='2'&&total()>=36&&!cleanScoreReason()){
    state.scoreReason='More than 35 availability gaps';
    return true;
  }
  return false;
}

function syncReasonUI(){
  const panel=document.getElementById('reasonPanel');
  const input=document.getElementById('scoreReason');
  const count=document.getElementById('reasonCount');
  const title=document.getElementById('reasonTitle');
  if(!panel||!input)return;
  const needed=needsScoreReason();
  panel.classList.toggle('show',needed);
  title.textContent=needed?'Reason for score '+state.score:'Reason for score';
  input.value=state.scoreReason||'';
  input.classList.toggle('reasonerror',needed&&!cleanScoreReason());
  if(count)count.textContent=String(input.value.length)+'/120';
}

function updateCompleteAll(){
  const btn=document.getElementById('completeAll');
  if(!btn)return;
  const everythingDone=AREAS.every(a=>state.done[a]===true)&&state.additionalDone===true;
  btn.disabled=everythingDone;
  btn.textContent=everythingDone?'Complete ✓':'Complete all';
}

function updatePublish(){
  const allCounted=AREAS.every(a=>state.done[a]===true);
  const store=state.store||'';
  const score=state.score||'';
  const validStore=/^\d{3,4}$/.test(store);
  const validScore=['1','2','3','4'].includes(score);
  const btn=document.getElementById('publish');

  btn.disabled=!allCounted;
  if(!allCounted){btn.textContent='Count all sections to publish';return;}
  if(!store && !score){btn.textContent='Enter store number & score';return;}
  if(!store){btn.textContent='Enter store number';return;}
  if(!validStore){btn.textContent='Store number must be 3–4 digits';return;}
  if(!score){btn.textContent='Select score';return;}
  if(!validScore){btn.textContent='Score must be 1–4';return;}
  if(needsScoreReason()&&!cleanScoreReason()){btn.textContent='Add reason for score '+score;return;}
  btn.textContent='Publish Availability';
}

function ensureVisible(el,focus=false){
  if(!el)return;
  if(focus&&typeof el.focus==='function')el.focus({preventScroll:true});
  requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'center'}));
}

function manualInputs(){
  return [...document.querySelectorAll('#gaps input[data-manual-seq="1"]')].filter(el=>!el.disabled);
}

function nextManualInput(current){
  const inputs=manualInputs();
  const i=inputs.indexOf(current);
  return i>=0&&i<inputs.length-1?inputs[i+1]:null;
}

let activeManualInput=null;
let replaceOnNextDigit=true;
let manualScrollTimer=null;

function updateKeypadEnter(){
  const btn=document.getElementById('keypadEnter');
  if(!btn)return;
  btn.textContent=activeManualInput&&nextManualInput(activeManualInput)?'Enter ↓':'Done ✓';
}

function scrollManualFieldIntoView(el){
  if(!el)return;
  clearTimeout(manualScrollTimer);
  manualScrollTimer=setTimeout(()=>{
    const row=el.closest('.gaprow')||el;
    const keypad=document.getElementById('customKeypad');
    const header=document.querySelector('header');
    const rect=row.getBoundingClientRect();
    const topEdge=(header?header.getBoundingClientRect().bottom:0)+10;
    const keypadTop=keypad&&document.body.classList.contains('keypad-open')
      ?keypad.getBoundingClientRect().top
      :window.innerHeight;
    const bottomEdge=keypadTop-12;
    let delta=0;
    if(rect.bottom>bottomEdge)delta=rect.bottom-bottomEdge+12;
    else if(rect.top<topEdge)delta=rect.top-topEdge-12;
    if(Math.abs(delta)>2)window.scrollTo({top:Math.max(0,window.scrollY+delta),behavior:'auto'});
  },35);
}

function openCustomKeypad(input,label){
  if(!input||input.disabled)return;
  if(activeManualInput&&activeManualInput!==input)activeManualInput.classList.remove('customactive');
  activeManualInput=input;
  input.classList.add('customactive');
  input.dataset.before=String(readManualValue(input));
  input.dataset.remembered='';
  replaceOnNextDigit=true;
  document.getElementById('keypadLabel').textContent=label||input.getAttribute('aria-label')||'Enter count';
  document.body.classList.add('keypad-open');
  document.getElementById('customKeypad').setAttribute('aria-hidden','false');
  updateKeypadEnter();
  requestAnimationFrame(()=>scrollManualFieldIntoView(input));
}

function closeCustomKeypad(scrollToTotal=false){
  clearTimeout(manualScrollTimer);
  if(activeManualInput)activeManualInput.classList.remove('customactive');
  activeManualInput=null;
  replaceOnNextDigit=true;
  document.body.classList.remove('keypad-open');
  document.getElementById('customKeypad').setAttribute('aria-hidden','true');
  if(scrollToTotal)setTimeout(()=>document.getElementById('storeTotal')?.scrollIntoView({behavior:'smooth',block:'center'}),40);
}

function readManualValue(input){
  if(!input)return 0;
  if(input.dataset.extra==='1')return Number(state.additional)||0;
  return Number(state.gaps[input.dataset.area])||0;
}

function writeManualValue(input,value){
  if(!input||input.disabled)return;
  const clean=String(value).replace(/\D/g,'').slice(0,4);
  const numeric=clean===''?0:Number(clean);
  const before=Number(input.dataset.before||0);
  if(!input.dataset.remembered&&numeric!==before){
    remember();
    input.dataset.remembered='1';
  }
  if(input.dataset.extra==='1')state.additional=numeric;
  else state.gaps[input.dataset.area]=numeric;
  input.value=clean;
  input.parentElement.classList.toggle('hasvalue',clean!=='');
  save();
  document.getElementById('storeTotal').textContent=total();
}

function pressCustomDigit(digit){
  if(!activeManualInput)return;
  let current=String(activeManualInput.value||'').replace(/\D/g,'');
  if(replaceOnNextDigit){current='';replaceOnNextDigit=false;}
  if(current.length>=4)return;
  writeManualValue(activeManualInput,current+digit);
}

function customBackspace(){
  if(!activeManualInput)return;
  let current=String(activeManualInput.value||'').replace(/\D/g,'');
  if(replaceOnNextDigit){
    current='';
    replaceOnNextDigit=false;
  }else current=current.slice(0,-1);
  writeManualValue(activeManualInput,current);
}

function advanceManualInput(current){
  if(!current)return;
  const next=nextManualInput(current);
  if(next){
    current.classList.remove('customactive');
    activeManualInput=next;
    next.classList.add('customactive');
    next.dataset.before=String(readManualValue(next));
    next.dataset.remembered='';
    replaceOnNextDigit=true;
    document.getElementById('keypadLabel').textContent=next.dataset.label||next.getAttribute('aria-label')||'Enter count';
    updateKeypadEnter();
    scrollManualFieldIntoView(next);
  }else closeCustomKeypad(true);
}

const lockedTapCounts={};
function lockedCounterTap(area){
  if(!state.done[area])return false;
  lockedTapCounts[area]=(lockedTapCounts[area]||0)+1;
  if(lockedTapCounts[area]>=2){
    lockedTapCounts[area]=0;
    remember();state.done[area]=false;
    save();renderGaps();
  }
  return true;
}

function makeGapRow(area){
  const row=document.createElement('div');
  row.className='gaprow'+(state.done[area]?' done':'');
  row.dataset.area=area;
  row.innerHTML=`
    <div class="area">${LABELS[area]}</div>
    <button type="button" class="counter minus" aria-label="Decrease ${LABELS[area]}">−</button>
    <div class="editwrap ${state.done[area] || state.gaps[area]?'hasvalue':''}">
      <input class="gapinput" inputmode="none" readonly data-manual-seq="1" data-area="${area}" data-label="${LABELS[area]}" placeholder=" " aria-label="${LABELS[area]} gap count" value="${state.done[area] ? Number(state.gaps[area]||0) : (state.gaps[area]||'')}" ${state.done[area]?'disabled':''}>
      ${state.done[area]?'':'<span class="editcue">EDIT</span>'}
    </div>
    <button type="button" class="counter plus" aria-label="Increase ${LABELS[area]}">+</button>
    <button type="button" class="donebtn">${state.done[area]?'✓ Counted':'Not counted'}</button>`;

  const gapInput=row.querySelector('.gapinput');
  gapInput.onclick=()=>openCustomKeypad(gapInput,LABELS[area]);
  gapInput.onfocus=()=>{if(!state.done[area])openCustomKeypad(gapInput,LABELS[area])};

  row.querySelector('.plus').onclick=()=>{closeCustomKeypad(false);if(lockedCounterTap(area))return;remember();state.gaps[area]++;save();renderGaps()};
  row.querySelector('.minus').onclick=()=>{closeCustomKeypad(false);if(lockedCounterTap(area))return;if(state.gaps[area]>0){remember();state.gaps[area]--;}save();renderGaps()};
  row.querySelector('.donebtn').onclick=()=>{closeCustomKeypad(false);lockedTapCounts[area]=0;remember();state.done[area]=!state.done[area];save();renderGaps()};
  return row;
}

function renderGaps(){
  const box=document.getElementById('gaps');
  box.innerHTML='';
  AREAS.forEach(a=>box.appendChild(makeGapRow(a)));

  const extra=document.createElement('div');
  extra.className='gaprow additionalrow'+(state.additionalDone?' done':'');
  extra.innerHTML=`
    <div class="area">Additional<br>Counts</div>
    <button type="button" class="counter minus" aria-label="Decrease additional counts">−</button>
    <div class="editwrap ${state.additionalDone || state.additional?'hasvalue':''}">
      <input class="additionalinput" inputmode="none" readonly data-manual-seq="1" data-extra="1" data-label="Additional Counts" placeholder=" " aria-label="Additional counts" value="${state.additionalDone ? Number(state.additional||0) : (state.additional||'')}" ${state.additionalDone?'disabled':''}>
      ${state.additionalDone?'':'<span class="editcue">EDIT</span>'}
    </div>
    <button type="button" class="counter plus" aria-label="Increase additional counts">+</button>
    <button type="button" class="donebtn">${state.additionalDone?'✓ Done':'Not done'}</button>`;

  const extraInput=extra.querySelector('.additionalinput');
  extraInput.onclick=()=>openCustomKeypad(extraInput,'Additional Counts');
  extraInput.onfocus=()=>{if(!state.additionalDone)openCustomKeypad(extraInput,'Additional Counts')};
  extra.querySelector('.plus').onclick=()=>{closeCustomKeypad(false);if(state.additionalDone)return;remember();state.additional=(Number(state.additional)||0)+1;save();renderGaps()};
  extra.querySelector('.minus').onclick=()=>{closeCustomKeypad(false);if(state.additionalDone)return;if((Number(state.additional)||0)>0){remember();state.additional--;}save();renderGaps()};
  extra.querySelector('.donebtn').onclick=()=>{closeCustomKeypad(false);remember();state.additionalDone=!state.additionalDone;save();renderGaps()};
  box.appendChild(extra);

  document.getElementById('storeTotal').textContent=total();
  if(applyAutomaticScoreReason())save();
  syncReasonUI();
  updateCompleteAll();
  updatePublish();
}

function goToMissingDetails(){
  const storeEl=document.getElementById('store');
  const scoreControl=document.getElementById('scoreControl');
  const validStore=/^\d{3,4}$/.test(state.store||'');
  const validScore=['1','2','3','4'].includes(state.score||'');

  storeEl.classList.toggle('storeerror',!validStore);
  scoreControl.classList.toggle('scoreerror',!validScore);

  if(!validStore){ensureVisible(storeEl,true);return false;}
  if(!validScore){ensureVisible(document.getElementById('scoreRow'),false);return false;}
  if(needsScoreReason()&&!cleanScoreReason()){
    const reasonInput=document.getElementById('scoreReason');
    reasonInput.classList.add('reasonerror');
    ensureVisible(document.getElementById('reasonPanel'),false);
    setTimeout(()=>reasonInput.focus({preventScroll:true}),120);
    return false;
  }
  return true;
}

document.getElementById('undo').onclick=()=>{
  const previous=state.history.pop();
  if(!previous)return;
  redoHistory.push(snapshot());
  state.gaps={...previous.gaps};
  state.done={...previous.done};
  state.additional=Number(previous.additional)||0;
  state.additionalDone=!!previous.additionalDone;
  save();renderGaps();updateUndoRedo();
};

document.getElementById('redo').onclick=()=>{
  const next=redoHistory.pop();
  if(!next)return;
  state.history.push(snapshot());
  state.gaps={...next.gaps};
  state.done={...next.done};
  state.additional=Number(next.additional)||0;
  state.additionalDone=!!next.additionalDone;
  save();renderGaps();updateUndoRedo();
};

document.getElementById('completeAll').onclick=()=>{
  closeCustomKeypad(false);
  const everythingDone=AREAS.every(a=>state.done[a]===true)&&state.additionalDone===true;
  if(everythingDone)return;
  remember();
  AREAS.forEach(a=>state.done[a]=true);
  state.additionalDone=true;
  save();
  renderGaps();
};

document.getElementById('reset').onclick=()=>document.getElementById('resetModal').classList.add('show');
function performReset(clearStore){
  const keepStore=state.store||'';
  state={gaps:Object.fromEntries(AREAS.map(a=>[a,0])),store:clearStore?'':keepStore,score:'',scoreReason:'',history:[],saved:null,done:{},additional:0,additionalDone:false};
  localStorage.setItem(KEY,JSON.stringify(state));
  location.reload();
}
document.getElementById('resetFigures').onclick=()=>performReset(false);
document.getElementById('resetAll').onclick=()=>performReset(true);
document.getElementById('resetCancel').onclick=()=>document.getElementById('resetModal').classList.remove('show');
document.getElementById('resetModal').onclick=e=>{if(e.target.id==='resetModal')e.currentTarget.classList.remove('show')};

document.getElementById('store').value=state.store||'';
document.getElementById('store').oninput=e=>{
  const v=e.target.value.replace(/\D/g,'').slice(0,4);
  e.target.value=v;
  state.store=v;
  e.target.classList.remove('storeerror');
  save();updatePublish();
};
document.getElementById('store').onfocus=e=>setTimeout(()=>ensureVisible(e.target,false),120);

document.querySelectorAll('.scorebtn').forEach(btn=>{
  btn.onclick=()=>{
    const chosen=btn.dataset.score;
    const message=scoreGapMessage(chosen,total());
    const scoreControl=document.getElementById('scoreControl');
    if(message){
      scoreControl.classList.add('scoreerror');
      ensureVisible(document.getElementById('scoreRow'),false);
      alert(message);
      return;
    }
    state.score=chosen;
    if(chosen!=='1'&&chosen!=='2')state.scoreReason='';
    applyAutomaticScoreReason();
    scoreControl.classList.remove('scoreerror');
    syncScoreUI();
    syncReasonUI();
    save();updatePublish();
    if(chosen==='1'||chosen==='2')setTimeout(()=>ensureVisible(document.getElementById('reasonPanel'),false),60);
  };
});

const reasonInput=document.getElementById('scoreReason');
reasonInput.oninput=e=>{
  state.scoreReason=e.target.value.slice(0,120);
  e.target.classList.remove('reasonerror');
  document.getElementById('reasonCount').textContent=String(state.scoreReason.length)+'/120';
  save();updatePublish();
};
reasonInput.onblur=()=>{
  state.scoreReason=cleanScoreReason();
  syncReasonUI();
  save();updatePublish();
};

let scoreGuideTaps=[];

async function openScoreGuide(){
  closeCustomKeypad(false);
  document.activeElement?.blur?.();
  document.getElementById('scoreGuideModal').classList.add('show');
  try{
    if(screen.orientation&&typeof screen.orientation.lock==='function'){
      await screen.orientation.lock('landscape');
    }
  }catch(e){}
}

function closeScoreGuide(){
  document.getElementById('scoreGuideModal').classList.remove('show');
  try{
    if(screen.orientation&&typeof screen.orientation.unlock==='function'){
      screen.orientation.unlock();
    }
  }catch(e){}
}

document.getElementById('scoreLabel').addEventListener('pointerup',()=>{
  const now=Date.now();
  scoreGuideTaps=scoreGuideTaps.filter(t=>now-t<750);
  scoreGuideTaps.push(now);
  if(scoreGuideTaps.length>=3){
    scoreGuideTaps=[];
    openScoreGuide();
  }
});
document.getElementById('scoreLabel').addEventListener('dblclick',e=>e.preventDefault());
document.getElementById('scoreGuideClose').onclick=closeScoreGuide;
document.getElementById('scoreGuideModal').onclick=e=>{
  if(e.target.id==='scoreGuideModal')closeScoreGuide();
};

// Custom keypad controls. The manual gap fields are readonly, so iOS never opens
// its own number keyboard and therefore never repeatedly resizes/scrolls the viewport.
document.getElementById('keypadGrid').addEventListener('pointerdown',e=>e.preventDefault());
document.getElementById('keypadGrid').addEventListener('click',e=>{
  const key=e.target.closest('[data-key]')?.dataset.key;
  if(!key||!activeManualInput)return;
  if(/^\d$/.test(key))pressCustomDigit(key);
  else if(key==='backspace')customBackspace();
  else if(key==='enter')advanceManualInput(activeManualInput);
});
document.getElementById('keypadHide').onclick=()=>closeCustomKeypad(false);

// Tap outside the custom keypad or a manual number box to hide it cleanly.
document.addEventListener('click',e=>{
  if(!document.body.classList.contains('keypad-open'))return;
  if(e.target.closest('#customKeypad')||e.target.closest('#gaps input[data-manual-seq="1"]'))return;
  if(e.target.closest('.counter,.donebtn'))return;
  closeCustomKeypad(false);
});

// Prevent accidental browser double-tap zoom on the app controls.
document.addEventListener('dblclick',e=>{
  if(e.target.closest('button,input'))e.preventDefault();
},{passive:false});

document.getElementById('publish').onclick=async()=>{
  const unfinished=AREAS.filter(a=>state.done[a]!==true);
  if(unfinished.length)return;
  if(!goToMissingDetails()){updatePublish();return;}

  const scoreMessage=scoreGapMessage(state.score,total());
  if(scoreMessage){
    document.getElementById('scoreControl').classList.add('scoreerror');
    ensureVisible(document.getElementById('scoreRow'),false);
    alert(scoreMessage);
    return;
  }

  const publishedScore=needsScoreReason()
    ?'Score: '+state.score+' ('+cleanScoreReason()+')'
    :'Score: '+(state.score||'');
  const lines=[state.store||'',publishedScore,'Gaps: '+total(),''];

  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  ctx.font='17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  const labels=AREAS.map(a=>LABELS[a]);
  const widest=Math.max(...labels.map(label=>ctx.measureText(label).width));
  const normalGap=ctx.measureText('\u00A0').width;
  const target=widest+normalGap;
  const spacerChars=['\u2003','\u2007','\u00A0','\u202F','\u200A'];
  const spacers=spacerChars.map(ch=>({ch,width:ctx.measureText(ch).width})).filter(x=>x.width>0).sort((a,b)=>b.width-a.width);

  function publishPad(label){
    let remaining=Math.max(0,target-ctx.measureText(label).width);
    let pad='';
    for(const sp of spacers){
      while(remaining>=sp.width){
        pad+=sp.ch;
        remaining-=sp.width;
        if(pad.length>40)break;
      }
    }
    const smallest=spacers[spacers.length-1];
    if(smallest&&remaining>smallest.width/2)pad+=smallest.ch;
    return pad||'\u00A0';
  }

  AREAS.forEach(a=>lines.push(`${LABELS[a]}${publishPad(LABELS[a])}- ${state.gaps[a]}`));
  if((Number(state.additional)||0)>0)lines.push(`Additional Counts - ${state.additional}`);
  const text=lines.join('\n');

  try{
    if(navigator.share)await navigator.share({text});
    else{await navigator.clipboard.writeText(text);alert('Availability copied. Paste it into WhatsApp.')}
  }catch(e){
    if(e.name!=='AbortError')prompt('Copy Availability:',text);
  }
};

document.getElementById('formlink').onclick=()=>{
  window.location.href=SYS_FORM_URL;
};

syncScoreUI();
syncReasonUI();
renderGaps();
updateUndoRedo();
if(state.saved)document.getElementById('status').textContent='Saved '+state.saved;
</script>
</body>
