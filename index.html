<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Availability">

<title>Availability</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f4f7fa;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#17212b;
}

header{
background:white;
padding:22px 18px 16px;
border-bottom:1px solid #d9e0e6;
}

h1{
margin:0;
font-size:30px;
}

main{
padding:12px;
max-width:850px;
margin:auto;
}

.card{
background:white;
border:1px solid #d7dee5;
border-radius:16px;
margin-bottom:14px;
overflow:hidden;
}

.card h2{
margin:0;
padding:14px 16px;
font-size:19px;
background:#eaf0f6;
}

.score{
padding:14px 16px;
display:flex;
align-items:center;
gap:12px;
}

.score label{
font-weight:800;
}

.score input{
width:100px;
height:46px;
font-size:20px;
font-weight:700;
text-align:center;
border:1px solid #ccd5dd;
border-radius:10px;
}

.gaprow{
display:grid;
grid-template-columns:1fr 55px 52px 52px;
align-items:center;
gap:7px;
padding:8px 12px;
border-top:1px solid #e5e9ed;
}

.area{
font-weight:800;
font-size:17px;
}

.count{
font-size:19px;
font-weight:800;
text-align:center;
}

.counter{
height:44px;
border:0;
border-radius:11px;
font-size:26px;
font-weight:700;
}

.minus{
background:#f0f1f2;
color:#2583ef;
}

.plus{
background:#e7f5e9;
color:#16863b;
}

.total{
display:flex;
justify-content:space-between;
padding:14px 16px;
font-size:20px;
font-weight:900;
border-top:2px solid #ccd4dc;
}

.items{
overflow-x:auto;
}

.item{
display:grid;
grid-template-columns:110px 95px 95px 95px 85px 160px 44px;
gap:6px;
padding:7px;
border-top:1px solid #e4e8ec;
min-width:720px;
align-items:center;
}

.item.head{
background:#f5f7f9;
font-weight:800;
font-size:13px;
}

.item input{
width:100%;
height:42px;
border:1px solid #cbd4dc;
border-radius:8px;
padding:6px;
font-size:16px;
}

.num{
text-align:center;
font-weight:700;
}

.diff{
text-align:center;
font-weight:900;
font-size:17px;
}

.delete{
height:40px;
border:0;
border-radius:9px;
background:#f4e8e8;
font-size:20px;
}

.add{
display:block;
width:calc(100% - 24px);
margin:12px;
height:48px;
border:0;
border-radius:12px;
background:#1976d2;
color:white;
font-size:18px;
font-weight:800;
}

textarea{
display:block;
width:calc(100% - 24px);
margin:12px;
height:150px;
resize:vertical;
border:1px solid #cbd4dc;
border-radius:10px;
padding:12px;
font-size:17px;
font-family:inherit;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:14px;
}

.actions button{
height:52px;
border:0;
border-radius:12px;
font-size:17px;
font-weight:800;
}

.publish{
background:#16863b;
color:white;
}

.reset{
background:#e7ebef;
color:#17212b;
}

.hint{
text-align:center;
font-size:13px;
color:#687681;
margin:8px;
}
</style>
</head>

<body>

<header>
<h1>Availability</h1>
</header>

<main>

<section class="card">
<h2>Gaps</h2>

<div class="score">
<label>Score:</label>
<input id="score" type="number" inputmode="numeric">
</div>

<div id="gaps"></div>

<div class="total">
<span>STORE TOTAL</span>
<span id="total">0</span>
</div>
</section>

<section class="card">
<h2>Items to investigate</h2>

<div class="items">
<div class="item head">
<div>Item code</div>
<div>Stock file</div>
<div>Shop floor</div>
<div>Warehouse</div>
<div>Difference +/-</div>
<div>Findings / action</div>
<div></div>
</div>

<div id="itemRows"></div>
</div>

<button class="add" onclick="addItem()">＋ Add item</button>
</section>

<section class="card">
<h2>Additional information</h2>
<textarea id="notes" placeholder="Add notes here..."></textarea>
</section>

<div class="actions">
<button class="reset" onclick="resetAll()">Reset</button>
<button class="publish" onclick="publishAvailability()">Publish Availability</button>
</div>

<p class="hint">Your entries are saved automatically on this iPhone.</p>

</main>

<script>
const AREAS=[
"AMBIENT",
"FV",
"CHILLER",
"BREAD",
"FREEZER",
"BAKERY",
"MEAT",
"CONV",
"MILK"
];

const KEY="availability1329";

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
score:"",
gaps:Object.fromEntries(AREAS.map(x=>[x,0])),
items:[],
notes:""
};

function save(){
data.score=document.getElementById("score").value;
data.notes=document.getElementById("notes").value;
localStorage.setItem(KEY,JSON.stringify(data));
}

function renderGaps(){
const box=document.getElementById("gaps");
box.innerHTML="";

AREAS.forEach(area=>{
const row=document.createElement("div");
row.className="gaprow";

row.innerHTML=`
<div class="area">${area}</div>
<div class="count" id="gap-${area}">${data.gaps[area]||0}</div>
<button class="counter minus" type="button">−</button>
<button class="counter plus" type="button">+</button>
`;

const buttons=row.querySelectorAll("button");

buttons[0].onclick=()=>{
data.gaps[area]=Math.max(0,(data.gaps[area]||0)-1);
save();
renderGaps();
};

buttons[1].onclick=()=>{
data.gaps[area]=(data.gaps[area]||0)+1;
save();
renderGaps();
};

box.appendChild(row);
});

document.getElementById("total").textContent=
AREAS.reduce((sum,a)=>sum+(data.gaps[a]||0),0);
}

function addItem(item){
data.items.push(item||{
code:"",
stock:"",
floor:"",
warehouse:"",
finding:""
});

save();
renderItems();

setTimeout(()=>{
const rows=document.querySelectorAll(".itemrow");
const last=rows[rows.length-1];
if(last) last.querySelector(".code").focus();
},50);
}

function renderItems(){
const box=document.getElementById("itemRows");
box.innerHTML="";

data.items.forEach((item,index)=>{
const row=document.createElement("div");
row.className="item itemrow";

row.innerHTML=`
<input class="code num" type="text" inputmode="numeric"
placeholder="Code" value="${esc(item.code)}">

<input class="stock num jump" type="text" inputmode="numeric"
placeholder="0" value="${esc(item.stock)}">

<input class="floor num jump" type="text" inputmode="numeric"
placeholder="0" value="${esc(item.floor)}">

<input class="warehouse num jump" type="text" inputmode="numeric"
placeholder="0" value="${esc(item.warehouse)}">

<div class="diff"></div>

<input class="finding" type="text"
placeholder="Action" value="${esc(item.finding)}">

<button class="delete" type="button">×</button>
`;

const code=row.querySelector(".code");
const stock=row.querySelector(".stock");
const floor=row.querySelector(".floor");
const warehouse=row.querySelector(".warehouse");
const finding=row.querySelector(".finding");
const diff=row.querySelector(".diff");

function update(){
item.code=digits(code.value);
item.stock=digits(stock.value);
item.floor=digits(floor.value);
item.warehouse=digits(warehouse.value);
item.finding=finding.value;

code.value=item.code;
stock.value=item.stock;
floor.value=item.floor;
warehouse.value=item.warehouse;

showDifference();
save();
}

function showDifference(){
if(item.stock===""||item.floor===""||item.warehouse===""){
diff.textContent="";
diff.style.color="";
return;
}

const n=(Number(item.floor)+Number(item.warehouse))-Number(item.stock);

diff.textContent=n>0?"+"+n:String(n);
diff.style.color=n>0?"#16863b":n<0?"#c62828":"#17212b";
}

[code,stock,floor,warehouse].forEach(el=>{
el.addEventListener("input",update);
});

finding.addEventListener("input",update);

const jumps=[stock,floor,warehouse];

jumps.forEach((el,i)=>{
el.addEventListener("input",()=>{
if(el.value.length===1){
if(i<jumps.length-1){
jumps[i+1].focus();
}else{
finding.focus();
}
}
});
});

row.querySelector(".delete").onclick=()=>{
data.items.splice(index,1);
save();
renderItems();
};

showDifference();
box.appendChild(row);
});
}

function digits(v){
return v.replace(/\D/g,"");
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

async function publishAvailability(){

save();

const names={
AMBIENT:"Ambient",
FV:"Fv",
CHILLER:"Chiller",
BREAD:"Bread",
FREEZER:"Freezer",
BAKERY:"Bakery",
MEAT:"Meat",
CONV:"Conv",
MILK:"Milk"
};

let text=
`1329
Score: ${data.score}
Gaps:

${AREAS.map(a=>`${names[a]} - ${data.gaps[a]||0}`).join("\n")}`;

try{
if(navigator.share){
await navigator.share({
title:"Availability",
text:text
});
}else{
await navigator.clipboard.writeText(text);
alert("Availability copied.");
}
}catch(e){}
}

function resetAll(){
if(!confirm("Clear today's Availability data?")) return;

data={
score:"",
gaps:Object.fromEntries(AREAS.map(x=>[x,0])),
items:[],
notes:""
};

localStorage.setItem(KEY,JSON.stringify(data));
location.reload();
}

document.getElementById("score").value=data.score;
document.getElementById("score").addEventListener("input",save);

document.getElementById("notes").value=data.notes;
document.getElementById("notes").addEventListener("input",save);

renderGaps();
renderItems();

if(data.items.length===0){
for(let i=0;i<10;i++){
data.items.push({
code:"",
stock:"",
floor:"",
warehouse:"",
finding:""
});
}
save();
renderItems();
}
</script>

</body>
</html>
