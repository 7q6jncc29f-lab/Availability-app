<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f6f8"><title>Loading Availability Expand Test</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#1c2f45;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px;box-sizing:border-box}.status{max-width:450px;background:white;padding:25px 20px;border-radius:16px;box-shadow:0 6px 22px #0001;text-align:center;line-height:1.6}</style></head><body><div class="status" id="loadStatus">Loading original Availability app with expandable counting…</div>
<script>
const PATCH_CSS = "\n/* This is intentionally a minimal overlay: the original layout is kept. */\nheader {display:flex;align-items:center;justify-content:space-between;gap:8px}\nheader h1{min-width:0}\n.original-test-chip{white-space:nowrap;background:#fff4d3;color:#886000;border:1px solid #efdc99;border-radius:8px;font-size:10px;font-weight:900;letter-spacing:.3px;padding:6px 8px}\nmain{max-width:760px}\n#gaps{display:grid;gap:5px;padding:7px 8px 9px;background:#f5f7fa}\n#gaps .gaprow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;padding:7px 10px;min-height:51px;border:1px solid #dde3eb;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(13,39,65,.03);transition:background .12s ease}\n#gaps .gaprow.done{background:#eff9f2;border-color:#b5dbbf}\n#gaps .gaprow.bulkdone{background:#f6fcf7}\n#gaps .gaprow.additionalrow{border-top:1px solid #dde3eb}\n#gaps .gaprow .area{font-size:15px;line-height:1.2;letter-spacing:-.2px}\n#gaps .gaprow.additionalrow .area br{display:none}\n#gaps .gaprow.additionalrow .area br:after{content:' '}\n/* Keep real inputs/buttons in the DOM for the original counter and keypad logic. */\n#gaps .gaprow > .counter, #gaps .gaprow > .editwrap, #gaps .gaprow > .donebtn {display:none!important}\n#gaps .gaprow .smart-summary{border:1px solid #dce3ec;border-radius:9px;background:#f7f9fc;color:#3b4b5f;display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:136px;min-height:38px;padding:4px 9px;font-size:12px;font-weight:800;white-space:nowrap}\n#gaps .gaprow .smart-summary .smart-value{font-weight:950;color:#14263d;font-size:21px;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}\n#gaps .gaprow .smart-summary .smart-status{color:#687889;font-size:10px;line-height:1.1;min-width:51px;text-align:left}\n#gaps .gaprow.done .smart-summary{background:#e3f4e9;border-color:#c7e6d0}\n#gaps .gaprow.done .smart-summary .smart-status{color:#177540}\n#gaps .gaprow .smart-summary .smart-chevron{font-size:17px;color:#64758a}\n#gaps .gaprow.smart-expanded{border-color:#477ac7;box-shadow:0 0 0 2px rgba(41,116,212,.11);background:#fff;padding-bottom:11px;scroll-margin-top:100px}\n#gaps .smart-expanded .smart-summary{background:#e7effb;border-color:#a9c3ee}\n#gaps .smart-expanded .smart-chevron{transform:rotate(180deg)}\n#gaps .smart-panel{grid-column:1 / -1;padding:8px 0 0;margin-top:2px;border-top:1px solid #e8edf3}\n#gaps .smart-control-line{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);gap:9px}\n#gaps .smart-big-btn{height:76px;display:flex;align-items:center;justify-content:center;border:1px solid #cfdce9;border-radius:12px;font-size:42px;line-height:1;font-weight:750;touch-action:manipulation}\n#gaps .smart-minus{background:#edf2f9;color:#3769ab}\n#gaps .smart-plus{background:#dcf0e2;color:#167c3d;border-color:#b2dfbc}\n#gaps .smart-big-btn:active{filter:brightness(.96)}\n#gaps .smart-number{height:76px;border-radius:12px;border:2px solid #b6cbed;background:#fff;color:#142f5a;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:1px 4px}\n#gaps .smart-number strong{font-size:31px;line-height:1.15;letter-spacing:-1px;font-variant-numeric:tabular-nums}\n#gaps .smart-number small{font-size:10px;line-height:1.3;color:#4a72ac;font-weight:800}\n#gaps .smart-panel-help{color:#697b8e;text-align:center;font-size:11px;line-height:1.3;margin:6px 0 10px}\n#gaps .smart-actions{display:grid;grid-template-columns:105px minmax(0,1fr);gap:9px}\n#gaps .smart-collapse,#gaps .smart-finish,#gaps .smart-reopen{border:0;border-radius:11px;min-height:49px;font-size:14px;font-weight:900}\n#gaps .smart-collapse{background:#e8edf3;color:#46586d}\n#gaps .smart-finish{background:#17843b;color:white}\n#gaps .smart-reopen{background:#236dc9;color:white;grid-column:2}\n#gaps .smart-done-message{font-size:12px;color:#21784c;margin:8px 0 11px;text-align:center;font-weight:700}\n.total{margin-top:0}\n@media(max-width:390px){#gaps{padding:6px;gap:5px}#gaps .gaprow{padding:6px 9px;min-height:48px}#gaps .gaprow .area{font-size:14px}#gaps .gaprow .smart-summary{min-width:125px}#gaps .smart-control-line{grid-template-columns:minmax(0,1fr) 89px minmax(0,1fr);gap:8px}#gaps .smart-big-btn,#gaps .smart-number{height:73px}#gaps .smart-actions{grid-template-columns:95px minmax(0,1fr)}}\n@media(prefers-reduced-motion:reduce){#gaps .gaprow{transition:none}}\n";
const PATCH_JS = "\n// Expand-on-tap counting layer for the *original* Availability app.\n// Stored separately from the live site and deliberately reuses its logic.\nconst smartKeys=[...AREAS,'ADDITIONAL'];\nlet expandedKey=smartKeys.find(k=>!smartIsDone(k))||null;\nfunction smartIsDone(k){return k==='ADDITIONAL' ? !!state.additionalDone : !!state.done[k]}\nfunction smartGet(k){return k==='ADDITIONAL' ? (Number(state.additional)||0) : (Number(state.gaps[k])||0)}\nfunction smartSet(k,v){\n  const clean=Math.max(0,Math.min(9999,Math.trunc(v)));\n  if(k==='ADDITIONAL')state.additional=clean;\n  else state.gaps[k]=clean;\n}\nfunction smartNext(k){\n  const i=smartKeys.indexOf(k);\n  for(let off=1;off<smartKeys.length;off++){\n    const next=smartKeys[(i+off)%smartKeys.length];\n    if(!smartIsDone(next))return next;\n  }\n  return null;\n}\nfunction smartScroll(){\n  if(!expandedKey)return;\n  const key=expandedKey;\n  setTimeout(()=>{\n    if(expandedKey!==key)return;\n    const row=Array.from(document.querySelectorAll('#gaps .gaprow')).find(el=>el.dataset.smartKey===key);\n    if(!row)return;\n    const pane=row.querySelector('.smart-panel');\n    (pane||row).scrollIntoView({block:'nearest',behavior:'smooth'});\n  },80);\n}\nfunction smartSelect(k){\n  closeCustomKeypad(false);\n  expandedKey=expandedKey===k?null:k;\n  renderGaps();smartScroll();\n}\nfunction finishExpandedRow(k){\n  if(!k||smartIsDone(k))return;\n  closeCustomKeypad(false);\n  const row=Array.from(document.querySelectorAll('#gaps .gaprow')).find(el=>el.dataset.smartKey===k);\n  const doneBtn=row?.querySelector('.donebtn');\n  expandedKey=smartNext(k);\n  // Use original Done handler. This preserves its history, save and count rules.\n  if(doneBtn)doneBtn.click();\n  else{remember();if(k==='ADDITIONAL')state.additionalDone=true;else state.done[k]=true;save();renderGaps()}\n  smartScroll();\n}\nfunction smartOpenForEdit(k){\n  closeCustomKeypad(false);\n  if(!smartIsDone(k))return;\n  remember();\n  if(k==='ADDITIONAL')state.additionalDone=false;\n  else state.done[k]=false;\n  expandedKey=k;\n  save();renderGaps();smartScroll();\n}\nfunction smartStepper(k,step,display){\n  return {\n    canHold:()=>!smartIsDone(k)&&(step>0||smartGet(k)>0),\n    onTap:()=>{\n      closeCustomKeypad(false);\n      if(smartIsDone(k))return;\n      const next=Math.max(0,Math.min(9999,smartGet(k)+step));\n      if(next!==smartGet(k)){\n        remember();smartSet(k,next);save();renderGaps();\n      }\n    },\n    onHoldStart:()=>{closeCustomKeypad(false);remember();},\n    onHoldStep:()=>{smartSet(k,smartGet(k)+step);refreshExpandedCount();},\n    onHoldEnd:()=>{save();renderGaps();}\n  };\n}\nfunction refreshExpandedCount(){\n  document.querySelectorAll('#gaps .gaprow[data-smart-key]').forEach(row=>{\n    const k=row.dataset.smartKey;\n    const value=smartGet(k);\n    const summaryVal=row.querySelector('.smart-value');\n    const panelValue=row.querySelector('.smart-number strong');\n    if(summaryVal)summaryVal.textContent=String(value);\n    if(panelValue)panelValue.textContent=String(value);\n  });\n  const el=document.getElementById('storeTotal');\n  if(el)el.textContent=String(total());\n}\nfunction smartEnhance(){\n  let doneCount=0;\n  document.querySelectorAll('#gaps .gaprow').forEach((row,index)=>{\n    const k=row.dataset.area||'ADDITIONAL';\n    row.dataset.smartKey=k;\n    const counted=smartIsDone(k);\n    if(k!=='ADDITIONAL'&&counted)doneCount++;\n    const label=k==='ADDITIONAL'?'Additional Counts':LABELS[k];\n    const summary=document.createElement('button');\n    summary.type='button';summary.className='smart-summary';\n    summary.setAttribute('aria-label',label+': '+smartGet(k)+' counted gaps'+(counted?', complete':'')+'. Tap to expand.');\n    summary.setAttribute('aria-expanded',String(expandedKey===k));\n    summary.innerHTML='<span class=\"smart-value\">'+smartGet(k)+'</span><span class=\"smart-status\">'+(counted?'✓ Counted':'To count')+'</span><span class=\"smart-chevron\" aria-hidden=\"true\">⌄</span>';\n    summary.addEventListener('click',()=>smartSelect(k));\n    row.appendChild(summary);\n    row.addEventListener('click',e=>{\n      if(e.target.closest('button,input,.smart-panel'))return;\n      smartSelect(k);\n    });\n    if(expandedKey!==k)return;\n    row.classList.add('smart-expanded');\n    const panel=document.createElement('div');panel.className='smart-panel';\n    const baseInput=row.querySelector('.gapinput,.additionalinput');\n    if(counted){\n      panel.innerHTML='<div class=\"smart-done-message\">This section is already counted. Reopen it if the figure needs changing.</div><div class=\"smart-actions\"><button type=\"button\" class=\"smart-collapse\">Close</button><button type=\"button\" class=\"smart-reopen\">Reopen to edit</button></div>';\n      panel.querySelector('.smart-collapse').onclick=()=>smartSelect(k);\n      panel.querySelector('.smart-reopen').onclick=()=>smartOpenForEdit(k);\n    }else{\n      panel.innerHTML='<div class=\"smart-control-line\"><button type=\"button\" class=\"smart-big-btn smart-minus\" aria-label=\"Decrease '+label+'\">−</button><button type=\"button\" class=\"smart-number\" aria-label=\"Enter exact '+label+' count\"><strong>'+smartGet(k)+'</strong><small>EDIT</small></button><button type=\"button\" class=\"smart-big-btn smart-plus\" aria-label=\"Increase '+label+'\">+</button></div><div class=\"smart-panel-help\">Tap + or − to count. Hold to count quickly. Tap the number to type.</div><div class=\"smart-actions\"><button type=\"button\" class=\"smart-collapse\">Collapse</button><button type=\"button\" class=\"smart-finish\">Done &amp; Next ↓</button></div>';\n      attachHoldCounter(panel.querySelector('.smart-minus'),smartStepper(k,-1));\n      attachHoldCounter(panel.querySelector('.smart-plus'),smartStepper(k,1));\n      panel.querySelector('.smart-number').onclick=()=>openCustomKeypad(baseInput,label);\n      panel.querySelector('.smart-collapse').onclick=()=>smartSelect(k);\n      panel.querySelector('.smart-finish').onclick=()=>finishExpandedRow(k);\n    }\n    row.appendChild(panel);\n  });\n  const hdr=document.querySelector('header h1');\n  if(hdr)hdr.setAttribute('aria-label','Availability — '+doneCount+' of 9 counted');\n  if(expandedKey&&smartIsDone(expandedKey) && smartKeys.every(smartIsDone)){\n    // When bulk-completion happens, show only collapsed rows until the user opens one.\n    expandedKey=null;\n    // The next render will reflect the collapsed state.\n    document.querySelectorAll('#gaps .smart-expanded').forEach(el=>{el.classList.remove('smart-expanded');el.querySelector('.smart-panel')?.remove()});\n  }\n}\nfunction renderGaps(){\n  originalRenderGaps();\n  smartEnhance();\n}\n";

(async function(){
  const output=document.getElementById('loadStatus');
  try{
    // Same-origin fetch ensures original site's scripts and relative paths work.
    if(location.protocol==='file:')throw new Error('Upload this file to the same GitHub repository as index.html, then open its test URL. iPhone Files preview cannot load the original site securely.');
    const response=await fetch(new URL('./index.html',location.href),{cache:'no-store'});
    if(!response.ok)throw new Error('Original site returned HTTP '+response.status);
    let original=await response.text();
    const required=["const KEY='availability-app-v2';",'function renderGaps(){','function goToMissingDetails(){','function advanceManualInput(current){','function updateKeypadEnter(){','function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}'];
    for(const needle of required){if(!original.includes(needle))throw new Error('The original app has changed ('+needle.slice(0,36)+'). No test changes were applied.');}
    // New independent localStorage key: test counts NEVER mix with live counts.
    original=original.replace("const KEY='availability-app-v2';","const KEY='availability-original-expand-test-v1';");
    original=original.replace("const APP_VERSION='1.6';","const APP_VERSION='original-expand-test-v1';");
    original=original.replace('<title>Availability</title>','<title>Availability · Expand Test</title>');
    original=original.replace('<header><h1>Availability</h1></header>','<header><h1>Availability</h1><span class="original-test-chip">EXPAND TEST</span></header>');
    original=original.replace('</style>','</style><style>'+PATCH_CSS+'</style>');
    original=original.replace('function renderGaps(){','function originalRenderGaps(){');
    original=original.replace('function goToMissingDetails(){',PATCH_JS+'\nfunction goToMissingDetails(){');
    original=original.replace('function advanceManualInput(current){','function advanceManualInput(current){\n  if(current && expandedKey){finishExpandedRow(expandedKey);return;}');
    original=original.replace('function updateKeypadEnter(){','function updateKeypadEnter(){\n  if(activeManualInput && expandedKey){document.getElementById(\'keypadEnter\').textContent=\'Done & Next ✓\';return;}');
    original=original.replace('function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state))}','function save(){stamp();localStorage.setItem(KEY,JSON.stringify(state));if(typeof refreshExpandedCount===\'function\')refreshExpandedCount()}');
    // Document.write intentionally replaces only this test page, not the live site.
    document.open();document.write(original);document.close();
  }catch(error){
    output.textContent='Could not load the original Availability app: '+error.message;
    output.style.color='#a92727';
  }
})();

</script></body></html>
