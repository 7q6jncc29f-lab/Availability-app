mber strong{font-size:33px;font-weight:950;line-height:1.03}\n#gaps .orig-large-number small{font-size:10px;font-weight:850;color:#477ab4;letter-spacing:.4px;margin-top:6px}\n#gaps .orig-panel-actions{display:grid;grid-template-columns:91px minmax(0,1fr);gap:9px;margin-top:11px}\n#gaps .orig-panel-actions button{min-width:0;min-height:49px;border:0;border-radius:11px;font-size:14px;font-weight:850;touch-action:manipulation}\n#gaps .orig-collapse{background:#ebeff4;color:#576579}\n#gaps .orig-next{background:#17823b;color:white}\n#gaps .orig-edit-unlock{background:#1976d2;color:white}\n#gaps .orig-panel-help{font-size:11px;line-height:1.4;color:#6c7988;margin:6px 0 0;text-align:center}\n#gaps .orig-done-note{text-align:center;color:#1f713c;font-size:13px;font-weight:700;padding:10px 0 3px}\n@media(max-width:390px){#gaps .orig-large-controls{grid-template-columns:minmax(0,1fr) 89px minmax(0,1fr);gap:7px}#gaps .orig-large-btn,#gaps .orig-large-number{height:77px}#gaps .orig-large-number strong{font-size:30px}#gaps .orig-panel-actions{grid-template-columns:82px minmax(0,1fr);gap:7px}}\n@media(max-width:350px){#gaps .orig-large-controls{grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:6px}#gaps .orig-large-btn,#gaps .orig-large-number{height:72px}#gaps .orig-large-number strong{font-size:28px}}\n@media(prefers-reduced-motion:reduce){#gaps .orig-large-btn:active{transform:none}}\n";const PATCH_JS="\n// V6 preserves every original row, control and style in its collapsed state.\n// The panel is created only when an existing department row is tapped.\nconst origKeys=[...AREAS,'ADDITIONAL'];\nlet origExpandedKey=null;\nfunction origDone(k){return k==='ADDITIONAL'?!!state.additionalDone:!!state.done[k]}\nfunction origValue(k){return k==='ADDITIONAL'?(Number(state.additional)||0):(Number(state.gaps[k])||0)}\nfunction origChange(k,value){\n  const n=Math.min(9999,Math.max(0,Number(value)||0));\n  if(k==='ADDITIONAL')state.additional=n; else state.gaps[k]=n;\n}\nfunction origNextKey(k){\n  const idx=origKeys.indexOf(k);\n  for(let i=1;i<origKeys.length;i++){\n    const next=origKeys[(idx+i)%origKeys.length];\n    if(!origDone(next))return next;\n  }\n  return null;\n}\nfunction origScrollToActive(){\n  const current=origExpandedKey;\n  if(!current)return;\n  setTimeout(()=>{\n    if(current!==origExpandedKey||document.body.classList.contains('keypad-open'))return;\n    const row=[...document.querySelectorAll('#gaps .gaprow')].find(el=>el.dataset.origKey===current);\n    row?.querySelector('.orig-panel')?.scrollIntoView({block:'nearest',behavior:'smooth'});\n  },85);\n}\nfunction origToggle(k){\n  closeCustomKeypad(false);\n  origExpandedKey=origExpandedKey===k?null:k;\n  renderGaps();origScrollToActive();\n}\nfunction origFinish(k){\n  if(!k||origDone(k))return;\n  closeCustomKeypad(false);\n  // Original Done listener handles undo history, persistence and redraw.\n  const row=[...document.querySelectorAll('#gaps .gaprow')].find(el=>el.dataset.origKey===k);\n  const originalDone=row?.querySelector('.donebtn');\n  origExpandedKey=origNextKey(k);\n  if(originalDone)originalDone.click();\n  else {remember();if(k==='ADDITIONAL')state.additionalDone=true;else state.done[k]=true;save();renderGaps();}\n  origScrollToActive();\n}\nfunction origReopen(k){\n  if(!origDone(k))return;\n  closeCustomKeypad(false);\n  const row=[...document.querySelectorAll('#gaps .gaprow')].find(el=>el.dataset.origKey===k);\n  // Original Done button toggles counted off (and stores undo history).\n  if(row){row.querySelector('.donebtn')?.click();}\n  else {remember();if(k==='ADDITIONAL')state.additionalDone=false;else state.done[k]=false;save();renderGaps();}\n  origExpandedKey=k;\n  renderGaps();origScrollToActive();\n}\nfunction origUpdateDisplayed(){\n  document.querySelectorAll('#gaps .gaprow.orig-expanded').forEach(row=>{\n    const val=origValue(row.dataset.origKey);\n    const large=row.querySelector('.orig-large-number strong');\n    if(large)large.textContent=String(val);\n    // The original row number input is updated by its original controls/keypad.\n    const field=row.querySelector('.gapinput,.additionalinput');\n    if(field && !document.body.classList.contains('keypad-open'))field.value=String(val);\n  });\n  const totalEl=document.getElementById('storeTotal');\n  if(totalEl)totalEl.textContent=String(total());\n}\nfunction origLargeStepper(k,step){\n  return {\n    canHold:()=>!origDone(k)&&(step>0||origValue(k)>0),\n    onTap:()=>{\n      closeCustomKeypad(false);\n      if(origDone(k))return;\n      const next=Math.max(0,Math.min(9999,origValue(k)+step));\n      if(next===origValue(k))return;\n      remember();origChange(k,next);save();renderGaps();\n    },\n    onHoldStart:()=>{closeCustomKeypad(false);remember()},\n    onHoldStep:()=>{origChange(k,origValue(k)+step);origUpdateDisplayed()},\n    onHoldEnd:()=>{save();renderGaps()}\n  };\n}\nfunction origDecorateRows(){\n  const rows=[...document.querySelectorAll('#gaps .gaprow')];\n  for(const row of rows){\n    const k=row.dataset.area||'ADDITIONAL';\n    row.dataset.origKey=k;\n    const label=k==='ADDITIONAL'?'Additional Counts':LABELS[k];\n    // Original minus, plus, input, and Counted buttons remain visible and functional.\n    row.addEventListener('click',e=>{\n      if(e.target.closest('button,input,.editwrap,.orig-panel'))return;\n      origToggle(k);\n    });\n    // When someone uses the original Counted button, shrink automatically.\n    const doneBtn=row.querySelector('.donebtn');\n    doneBtn?.addEventListener('click',()=>{\n      if(!origDone(k))origExpandedKey=origNextKey(k);\n      else if(origExpandedKey===k)origExpandedKey=null;\n    },true);\n    if(origExpandedKey!==k)continue;\n    row.classList.add('orig-expanded');\n    const panel=document.createElement('div');\n    panel.className='orig-panel';\n    if(origDone(k)){\n      panel.innerHTML='<div class=\"orig-panel-title\"><span>'+label+'</span><span>COUNTED</span></div><div class=\"orig-done-note\">Section counted. Reopen if you need to change it.</div><div class=\"orig-panel-actions\"><button class=\"orig-collapse\" type=\"button\">Close</button><button class=\"orig-edit-unlock\" type=\"button\">Reopen &amp; edit</button></div>';\n      panel.querySelector('.orig-collapse').onclick=()=>origToggle(k);\n      panel.querySelector('.orig-edit-unlock').onclick=()=>origReopen(k);\n    }else{\n      panel.innerHTML='<div class=\"orig-panel-title\"><span>'+label+'</span><span>LARGE COUNTING CONTROLS</span></div><div class=\"orig-large-controls\"><button type=\"button\" class=\"orig-large-btn orig-large-minus\" aria-label=\"Decrease '+label+' count\">−</button><button type=\"button\" class=\"orig-large-number\" aria-label=\"Enter '+label+' exact gap count\"><strong>'+origValue(k)+'</strong><small>EDIT</small></button><button type=\"button\" class=\"orig-large-btn orig-large-plus\" aria-label=\"Increase '+label+' count\">+</button></div><p class=\"orig-panel-help\">Tap to count · Hold for faster counting · Tap the number to type</p><div class=\"orig-panel-actions\"><button class=\"orig-collapse\" type=\"button\">Close</button><button class=\"orig-next\" type=\"button\">Done &amp; Next ↓</button></div>';\n      attachHoldCounter(panel.querySelector('.orig-large-minus'),origLargeStepper(k,-1));\n      attachHoldCounter(panel.querySelector('.orig-large-plus'),origLargeStepper(k,1));\n      panel.querySelector('.orig-large-number').onclick=()=>openCustomKeypad(row.querySelector('.gapinput,.additionalinput'),label);\n      panel.querySelector('.orig-collapse').onclick=()=>origToggle(k);\n      panel.querySelector('.orig-next').onclick=()=>origFinish(k);\n    }\n    row.appendChild(panel);\n  }\n  if(origExpandedKey && origDone(origExpandedKey) && !rows.some(row=>row.dataset.origKey===origExpandedKey&&row.classList.contains('orig-expanded'))){origExpandedKey=null;}\n}\nfunction renderGaps(){\n  originalRenderGaps();\n  origDecorateRows();\n}\n";
